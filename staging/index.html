<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IPTV Cast Receiver</title>
    <!-- Staging copy of ../index.html — see README "Staging receiver". -->
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden;
               font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
        video { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; background: #000; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000;
            transition: opacity 0.5s ease;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }

        #ready { z-index: 50; }
        #loading { z-index: 100; }
        #error { z-index: 200; }

        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loading-text {
            color: rgba(255,255,255,0.6);
            font-size: 16px; margin-top: 20px;
            letter-spacing: 1px;
        }
        /* A wait with a reason (e.g. the provider holding the connection):
           the line becomes a title and the reason goes underneath. */
        #loading-text.title {
            color: #fff; font-size: 26px; font-weight: 600;
            letter-spacing: 0; text-align: center;
            max-width: 720px; padding: 0 32px; margin-top: 28px;
        }
        #loading-detail {
            color: rgba(255,255,255,0.6); font-size: 16px;
            line-height: 1.5; text-align: center;
            max-width: 640px; padding: 0 32px; margin-top: 12px;
        }
        #loading-detail.hidden { display: none; }

        /* ━━━━━━ Notice (non-blocking, over the picture) ━━━━━━ */
        #notice {
            position: absolute; left: 50%; bottom: 48px;
            transform: translateX(-50%);
            max-width: 900px; padding: 14px 24px;
            background: rgba(0, 0, 0, 0.75); color: rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
            font-size: 18px; line-height: 1.45; text-align: center;
            z-index: 150; transition: opacity 0.4s ease; pointer-events: none;
        }
        #notice.hidden { opacity: 0; }

        /* ━━━━━━ Next episode (over the picture, bottom corner) ━━━━━━ */
        #upnext {
            position: absolute; bottom: 48px; inset-inline-end: 48px;
            max-width: 520px; padding: 16px 22px;
            background: rgba(0, 0, 0, 0.8); color: #fff;
            border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
            z-index: 160; transition: opacity 0.4s ease; pointer-events: none;
        }
        #upnext.hidden { opacity: 0; }
        #upnext-label {
            color: rgba(255,255,255,0.6); font-size: 14px;
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px;
        }
        #upnext-title { font-size: 22px; font-weight: 600; line-height: 1.3; }
        #upnext-count { color: rgba(255,255,255,0.75); font-size: 16px; margin-top: 8px; }

        /* ━━━━━━ Ready (idle, connected, no media yet) overlay ━━━━━━ */
        #ready-icon {
            width: 96px; height: 96px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.15);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 28px;
        }
        #ready-icon svg { width: 52px; height: 52px; fill: #818cf8; }
        #ready-title {
            color: #fff; font-size: 30px; font-weight: 600;
            margin-bottom: 10px; text-align: center;
            max-width: 720px; padding: 0 32px;
        }
        #ready-subtitle {
            color: rgba(255,255,255,0.55); font-size: 16px;
            line-height: 1.5; text-align: center;
            max-width: 640px; padding: 0 32px;
        }
        /* The words stay hidden until the TV knows the app's language (see
           "Language"), and fade out and back in when it changes under them. */
        #ready-text {
            display: flex; flex-direction: column; align-items: center;
            transition: opacity 0.25s ease;
        }
        #ready-text.pending { opacity: 0; }

        /* ━━━━━━ Error overlay ━━━━━━ */
        #error-icon {
            width: 84px; height: 84px;
            border-radius: 50%;
            background: rgba(229, 78, 78, 0.15);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 24px;
        }
        #error-icon svg { width: 44px; height: 44px; fill: #e54e4e; }
        #error-title {
            color: #fff; font-size: 28px; font-weight: 600;
            margin-bottom: 12px; text-align: center;
            max-width: 720px; padding: 0 32px;
        }
        #error-subtitle {
            color: rgba(255,255,255,0.65); font-size: 16px;
            line-height: 1.5; text-align: center;
            max-width: 640px; padding: 0 32px; margin-bottom: 28px;
        }
        #error-retry {
            background: #fff; color: #000;
            border: none; border-radius: 24px;
            padding: 12px 28px; font-size: 15px; font-weight: 600;
            cursor: pointer; outline: none;
        }
        #error-retry:focus { box-shadow: 0 0 0 3px rgba(255,255,255,0.4); }
        #error-code {
            position: absolute; bottom: 32px;
            color: rgba(255,255,255,0.3); font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.5px;
        }

        /* ━━━━━━ Staging badge ━━━━━━ */
        /* Only rendered when this file is served from a /staging/ path, so
           the very same file can be promoted to production untouched. */
        /* Tooling, not copy: left to right whatever the language. */
        #staging-badge, #debug { direction: ltr; }
        #staging-badge {
            position: absolute; top: 16px; left: 16px;
            background: rgba(245, 158, 11, 0.9); color: #000;
            font-size: 12px; font-weight: 700; letter-spacing: 2px;
            padding: 4px 10px; border-radius: 6px;
            z-index: 250; pointer-events: none;
        }
        #staging-badge.hidden { display: none; }

        /* ━━━━━━ Debug panel ━━━━━━ */
        /* Discreet rolling log in the top-right corner. Hidden by default;
           shows itself when an event is logged and auto-fades when the
           stream reaches PLAYING. Always visible (regardless of state) if
           the receiver URL has ?debug=1. */
        #debug {
            position: absolute; top: 16px; right: 16px;
            width: 380px; max-height: 60vh;
            background: rgba(0, 0, 0, 0.7);
            color: rgba(255, 255, 255, 0.85);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 300;
            overflow: hidden;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        #debug.hidden { opacity: 0; }
        #debug-head {
            color: rgba(255, 255, 255, 0.5);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        #debug-list { line-height: 1.45; }
        #debug-list .dbg-row { white-space: pre-wrap; word-break: break-all; }
        .dbg-row.err { color: #ff8a8a; }
        .dbg-row.warn { color: #ffd28a; }
        .dbg-row.ok { color: #9ae6b4; }
        .dbg-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            padding: 0 4px;
            border-radius: 3px;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div id="ready" class="overlay">
        <div id="ready-icon">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg>
        </div>
        <!-- Hidden until the TV knows which language to say it in; the
             English here only holds the space. -->
        <div id="ready-text" class="pending">
            <div id="ready-title">Ready to cast</div>
            <div id="ready-subtitle">Pick a channel or video on your phone to start streaming.</div>
        </div>
    </div>
    <div id="loading" class="overlay hidden">
        <div class="spinner"></div>
        <div id="loading-text">Loading...</div>
        <div id="loading-detail" class="hidden"></div>
    </div>
    <div id="error" class="overlay hidden">
        <div id="error-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 6l7.53 13H4.47L12 8zm-1 4v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
        </div>
        <div id="error-title">Stream unavailable</div>
        <div id="error-subtitle">The provider's server isn't responding. This isn't an app issue — try another channel or check back later.</div>
        <button id="error-retry">Retry</button>
        <div id="error-code"></div>
    </div>
    <div id="notice" class="hidden"></div>
    <div id="upnext" class="hidden">
        <div id="upnext-label"></div>
        <div id="upnext-title"></div>
        <div id="upnext-count"></div>
    </div>
    <div id="staging-badge" class="hidden">STAGING</div>
    <div id="debug" class="hidden">
        <div id="debug-head">debug</div>
        <div id="debug-list"></div>
    </div>
    <video id="media" autoplay></video>

    <!-- hls.js is served from this repo (vendor/, byte-identical to the npm
         package's dist/hls.min.js) so the TV doesn't depend on a third-party
         CDN being reachable; jsDelivr only as a fallback. Absolute path so
         the production and staging pages share the same copy. -->
    <script src="/caster/vendor/hls-1.5.7.min.js"></script>
    <script>window.Hls || document.write('<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"><\/script>');</script>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <!-- The TV's copy in the app's languages (next to this page, so staging
         and production each carry their own). -->
    <script src="strings.js"></script>
    <script>
        'use strict';

        // English here, the other 27 languages of the app in strings.js
        // (`window.NIPA_STRINGS`, built from i18n/*.json by
        // tools/build_strings.py): the TV says what the phone says, in the
        // app's language. A missing file or key falls back to English. The
        // language follows the sender's locale when it sends one (hello,
        // LOAD) and the device's otherwise.
        const STRINGS = Object.assign({
            en: {
                loading: "Loading...",
                buffering: "Buffering...",
                retrying: "Retrying...",
                reconnecting: "Reconnecting...",
                seeking: "Seeking…",
                seekingSlow: "Seeking — this may take a moment",
                seekingStuck: "Seek is taking too long — the server may not support this position. Try a different moment or stop casting.",
                readyTitle: "Ready to cast",
                readySubtitle: "Pick a channel or video on your phone to start streaming.",
                waitingProviderTitle: "Waiting for your provider…",
                waitingProviderDetail: "Your provider is refusing another connection right now: all the ones your account allows are in use, often by the phone you just cast from. It frees up within a minute or two, and this will start on its own.",
                errorTitle: "The TV couldn't play this",
                errorSubtitle: "Try again, or watch it on your phone.",
                networkTitle: "The TV can't reach your provider",
                networkSubtitle: "Check the TV's internet connection, or try again in a while.",
                codecTitle: "This TV can't play this channel",
                codecSubtitle: "Its video is more demanding than this TV or Chromecast can decode. Watch it on your phone, or look for an HD or SD version.",
                codecDetail: "The channel is in {format}.",
                formatAvcHighLevel: "1080p at 50/60 fps (H.264 level {level})",
                connLimitTitle: "Your account's connections are all in use",
                connLimitSubtitle: "Your provider limits how many devices can watch at once. Stop playback on the other ones and press Retry.",
                rateLimitTitle: "Your provider is limiting requests",
                rateLimitSubtitle: "Wait a few minutes and try again.",
                authTitle: "Your provider refused to play this on the TV",
                authSubtitle: "It may not be in your package, your subscription may have expired, or your provider may block TVs. It may still play on your phone.",
                notFoundTitle: "It's no longer on your provider's server",
                notFoundSubtitle: "Your provider removed or moved it. Refresh the list on your phone or try another one.",
                tsOnlyTitle: "This channel can't be cast",
                tsOnlySubtitle: "Your provider only offers it in a format the TV can't play. Watch it on your phone.",
                serverErrorTitle: "Your provider's server has a problem",
                serverErrorSubtitle: "It's not the app or the TV. Try again in a few minutes.",
                playerLoadTitle: "The TV couldn't start its player",
                playerLoadSubtitle: "Check the TV's internet connection and try again.",
                audioOnly: "Playing sound only: this device can't read this channel's video (in IPTV usually MPEG-2 or HEVC), or the channel has no picture.",
                undecodableTitle: "This TV can't play this channel",
                undecodableSubtitle: "It's broadcast in a form the TV's player can't read (common with interlaced 1080i channels). Watch it on your phone.",
                stalledTitle: "The picture froze",
                stalledSubtitle: "It couldn't recover on its own. Press Retry, or watch it on your phone.",
                vodCodecTitle: "This TV can't play this video",
                vodCodecSubtitle: "Its format is more than this TV or Chromecast can handle. Watch it on your phone.",
                vodVideoSubtitle: "Its picture is in {format}, which this TV or Chromecast can't decode. Watch it on your phone.",
                vodAudioSubtitle: "Its sound is in {format}, which this TV or Chromecast can't play. Watch it on your phone.",
                notVideoTitle: "Your provider sent a page instead of the video",
                notVideoSubtitle: "Your subscription may have ended, or your provider may be having problems. Check that it plays on your phone.",
                slowTitle: "Taking longer than usual…",
                slowDetail: "Some files take a while to start on this TV. It will start on its own.",
                upNextLabel: "Next episode",
                upNextIn: "Starts in {seconds} s",
                retry: "Retry",
            },
        }, (typeof window !== 'undefined' && window.NIPA_STRINGS) || {});
        // Written right to left.
        const RTL = ['ar', 'ur'];
        const pickLang = (locale) => {
            let code = String(locale || '').split(/[-_]/)[0].toLowerCase();
            // Norwegian: the app speaks Bokmål ("nb"); devices may say "no".
            if (code === 'no' || code === 'nn') code = 'nb';
            return STRINGS[code] ? code : 'en';
        };
        let LANG = pickLang(navigator.language);
        const t = (key) => (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key];

        const video = document.getElementById('media');
        const readyEl = document.getElementById('ready');
        const readyTitleEl = document.getElementById('ready-title');
        const readySubtitleEl = document.getElementById('ready-subtitle');
        const loadingEl = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const errorEl = document.getElementById('error');
        const errorTitle = document.getElementById('error-title');
        const errorSubtitle = document.getElementById('error-subtitle');
        const errorCode = document.getElementById('error-code');
        const errorRetry = document.getElementById('error-retry');

        // ━━━━━━ Language ━━━━━━
        //
        // The TV speaks the app's language, which the app gives in its hello
        // and in every LOAD. A Chromecast doesn't pass the launching phone's
        // language to the page: navigator.language is the device's own, even
        // when the launch asks for another (checked on a 2nd-gen Chromecast).
        // So the "Ready to cast" words stay hidden until the app says its
        // language (its hello comes about 0.3 s after the page starts). Only
        // an app that doesn't say in time gets a fallback: the last language
        // an app gave (kept on the device), else the device's own. Showing
        // the kept language at once was wrong whenever the app's language
        // had changed since, and the words switched in front of the user.
        const LANG_KEY = 'nipa.lang';
        const READY_TEXT_WAIT_MS = 2000;
        function recallLang() {
            try { return localStorage.getItem(LANG_KEY); } catch (_) { return null; }
        }
        function rememberLang(code) {
            // Storage off or full: the next launch waits for the app instead.
            try { localStorage.setItem(LANG_KEY, code); } catch (_) { /* */ }
        }
        const readyTextEl = document.getElementById('ready-text');
        let readyTextTimer = null;
        let readySwap = null;
        function fillReadyText() {
            readyTitleEl.textContent = t('readyTitle');
            readySubtitleEl.textContent = t('readySubtitle');
        }
        // The page's language and direction, and the copy already on screen
        // that doesn't change on its own (the "Ready to cast" screen).
        // [fromApp]: the app gave it, so it's kept and the words show now.
        function applyLang(locale, fromApp) {
            const before = LANG;
            LANG = pickLang(locale);
            const root = document.documentElement;
            if (root) {
                root.lang = LANG;
                root.dir = RTL.includes(LANG) ? 'rtl' : 'ltr';
            }
            if (fromApp) rememberLang(LANG);
            if (readySwap) {
                // A swap under way shows whatever is current when it lands.
            } else if (readyTextEl.classList.contains('pending')) {
                fillReadyText();
            } else if (LANG !== before) {
                // Words already on screen: fade out, swap, fade back in. The
                // swap waits for the fade to end (a Chromecast can start it
                // late; a fixed delay swapped the words half-faded), with a
                // backstop for a fade that never runs.
                readyTextEl.classList.add('pending');
                const swap = () => {
                    if (!readySwap) return;
                    clearTimeout(readySwap);
                    readySwap = null;
                    readyTextEl.removeEventListener('transitionend', swap);
                    fillReadyText();
                    readyTextEl.classList.remove('pending');
                };
                readyTextEl.addEventListener('transitionend', swap);
                readySwap = setTimeout(swap, 1000);
            }
            if (fromApp) showReadyText('app');
        }
        function showReadyText(why) {
            if (readyTextTimer) { clearTimeout(readyTextTimer); readyTextTimer = null; }
            if (readySwap || !readyTextEl.classList.contains('pending')) return;
            readyTextEl.classList.remove('pending');
            dbg('lang', `${LANG} (${why})`);
        }
        const recalledLang = recallLang();
        applyLang(recalledLang || navigator.language);

        let hls = null;

        // Last LOAD request — kept for Retry and recovery diagnostics.
        let lastLoad = null;

        // ━━━━━━ Staging marker ━━━━━━
        //
        // This receiver is shared by every app version in the wild and goes
        // live for all of them the moment it's pushed. Changes are developed
        // and exercised under /staging/ (its own unpublished App ID, only
        // launchable on Chromecasts registered as test devices), then the
        // file is promoted verbatim. The badge keys off the URL so nothing
        // has to be edited on promotion.
        const IS_STAGING = location.pathname.includes('/staging/');
        if (IS_STAGING) {
            document.getElementById('staging-badge').classList.remove('hidden');
        }

        // ━━━━━━ Sender handshake ━━━━━━
        //
        // The sender attaches `customData` to every LOAD:
        //   { sender: 'nipa', appVersion: '1.3.5', platform: 'android',
        //     features: { <key>: true, ... } }
        // Older app versions send nothing → `senderInfo` is null and every
        // `feature(key)` is false. New receiver behaviour MUST be gated behind
        // a feature key so legacy senders keep today's behaviour byte for
        // byte; the sender only advertises a key once its own half of that
        // behaviour ships in the same release.
        let senderInfo = null;
        let activeFeatures = {};
        const feature = (key) => activeFeatures[key] === true;
        // The sender's id for this LOAD (`customData.nipa.loadId`), echoed in
        // every status so the app can tell this channel's news from the
        // previous one's.
        let nipaLoadId = null;
        let lastCustom = {};

        function readSenderHandshake(request) {
            const custom = (request && request.customData) || {};
            senderInfo = custom.sender ? {
                app: String(custom.sender),
                version: String(custom.appVersion || '?'),
                platform: String(custom.platform || '?'),
            } : null;
            activeFeatures = (custom.features && typeof custom.features === 'object')
                ? custom.features : {};
            // Senders from 1.5.1 send their UI locale; for older ones it's the
            // device's language (per LOAD, so it never sticks from a
            // previous sender, and isn't kept for the next launch).
            const nipa = (custom.nipa && typeof custom.nipa === 'object') ? custom.nipa : {};
            nipaLoadId = typeof nipa.loadId === 'string' ? nipa.loadId : null;
            lastCustom = custom;
            const appLocale = nipa.locale || custom.locale;
            applyLang(appLocale || navigator.language, !!appLocale);
            const on = Object.keys(activeFeatures).filter(feature).join(',') || '-';
            dbg('sender', senderInfo
                ? `${senderInfo.app} ${senderInfo.version} (${senderInfo.platform}) features=${on}`
                : 'legacy sender (no customData)');
        }

        // ━━━━━━ Start-position verification (feature: resumeV2) ━━━━━━
        //
        // Legacy behaviour: the HLS path sets video.currentTime once on
        // MANIFEST_PARSED; the native path trusts CAF to apply
        // LoadRequestData.currentTime. Neither checks that it took. A
        // plain-HTTP VOD whose server ignores Range requests, or an MKV
        // without a cue index, can't be seeked: the element clamps the seek
        // to its seekable range and silently starts at 0:00 while the
        // sender believes the TV is at the resume point — and then saves
        // the restarted position over the user's real progress.
        //
        // With resumeV2 the guard re-checks after metadata/canplay/playing/
        // seeked and re-applies the target up to 3 times while the seekable
        // range covers it. If it never can, it gives up loudly (debug panel)
        // and the sender protects the saved progress on its side. A SEEK from
        // the sender disarms it so a user's choice is never fought.
        let startGuard = null;
        let lastKnownTime = 0;

        function seekableCovers(t) {
            try {
                const r = video.seekable;
                for (let i = 0; i < r.length; i++) {
                    if (t >= r.start(i) && t <= r.end(i)) return true;
                }
            } catch (_) {}
            return false;
        }

        function disarmStartTimeGuard() {
            if (!startGuard) return;
            startGuard.handlers.forEach(([name, h]) => video.removeEventListener(name, h));
            if (startGuard.timer) clearTimeout(startGuard.timer);
            startGuard = null;
        }

        function armStartTimeGuard(target) {
            disarmStartTimeGuard();
            if (!feature('resumeV2') || !(target > 0)) return;
            const guard = { target, attempts: 0, done: false, handlers: [], timer: null };
            const finish = (msg, level) => {
                guard.done = true;
                dbg('resume', msg, level);
                disarmStartTimeGuard();
            };
            const check = (ev) => {
                if (guard.done) return;
                const cur = video.currentTime || 0;
                if (cur >= target - 2) {
                    finish(`start at ${cur.toFixed(1)}s ok (${ev})`, 'ok');
                    return;
                }
                if (guard.attempts >= 3) {
                    finish(`gave up at ${cur.toFixed(1)}s, wanted ${target}s`, 'err');
                    return;
                }
                if (!seekableCovers(target)) {
                    dbg('resume', `${ev}: seekable range doesn't cover ${target}s yet`, 'warn');
                    return;
                }
                guard.attempts += 1;
                dbg('resume', `${ev}: at ${cur.toFixed(1)}s → re-seek to ${target}s (#${guard.attempts})`, 'warn');
                try {
                    video.currentTime = target;
                } catch (e) {
                    dbg('resume', `seek threw: ${e.message || e}`, 'err');
                }
            };
            ['loadedmetadata', 'canplay', 'playing', 'seeked'].forEach((name) => {
                const h = () => check(name);
                guard.handlers.push([name, h]);
                video.addEventListener(name, h);
            });
            // Hard stop: never keep interfering past this point.
            guard.timer = setTimeout(() => {
                if (!guard.done) dbg('resume', 'guard timed out', 'warn');
                disarmStartTimeGuard();
            }, 30000);
            startGuard = guard;
            dbg('resume', `guard armed for ${target}s`);
        }

        // Real playback position, so a Retry can pick up where the stream
        // broke rather than at the original LOAD start time.
        video.addEventListener('timeupdate', () => {
            if (video.currentTime > 0) lastKnownTime = video.currentTime;
        });

        function hideReady() {
            readyEl.classList.add('hidden');
        }
        const loadingDetail = document.getElementById('loading-detail');
        function showLoading(text, detail) {
            loadingText.textContent = text || t('loading');
            // With a reason underneath, the line reads as a title.
            loadingText.classList.toggle('title', !!detail);
            loadingDetail.textContent = detail || '';
            loadingDetail.classList.toggle('hidden', !detail);
            // Any time we show a loading state, the idle/ready overlay
            // is no longer relevant — hide it so we don't stack overlays.
            hideReady();
            loadingEl.classList.remove('hidden');
        }
        function hideLoading() {
            loadingEl.classList.add('hidden');
        }

        // A message over the picture that doesn't stop playback.
        const noticeEl = document.getElementById('notice');
        function showNotice(text) {
            noticeEl.textContent = text;
            noticeEl.classList.remove('hidden');
        }
        function hideNotice() {
            noticeEl.classList.add('hidden');
        }

        // Error copy by `kind`; anything else gets the generic "The TV
        // couldn't play this" message.
        //   'codec'       → this device can't decode the channel's format
        //   'connLimit'   → provider kept refusing a second connection
        //   'rateLimit'   → provider kept answering HTTP 429
        //   'auth'        → HTTP 401 / 403 / 407
        //   'notFound'    → HTTP 404 / 410
        //   'tsOnly'      → live channel only offered as MPEG-TS
        //   'serverError' → HTTP 5xx
        //   'playerLoad'  → hls.js itself couldn't be loaded
        //   'undecodable' → fragments arrive but nothing playable is buffered
        //   'stalled'     → the picture froze, never started, or the decoder
        //                   failed, and rebuilding didn't help
        //   'network'     → the provider can't be reached (no HTTP answer)
        //   'vodCodec'    → a movie or episode in a format this device can't
        //                   play ([subtitle] names the picture or the sound)
        //   'notVideo'    → the provider answered with a page, not a video
        const ERROR_KINDS = [
            'codec', 'connLimit', 'rateLimit', 'auth', 'notFound',
            'tsOnly', 'serverError', 'playerLoad', 'undecodable', 'stalled',
            'network', 'vodCodec', 'notVideo',
        ];

        function showError({ codeLine, kind, detail, status, subtitle }) {
            const key = ERROR_KINDS.includes(kind) ? kind : 'error';
            const fill = (s) => s.replace('{status}', status || '?');
            errorTitle.textContent = t(`${key}Title`);
            errorSubtitle.textContent = (subtitle || fill(t(`${key}Subtitle`))) + (detail ? ` ${detail}` : '');
            errorRetry.textContent = t('retry');
            errorCode.textContent = codeLine || '';
            hideLoading();
            hideReady();
            errorEl.classList.remove('hidden');
            // Try to focus Retry so a TV remote can press it without a tap.
            try { errorRetry.focus(); } catch (_) {}
        }
        function hideError() {
            errorEl.classList.add('hidden');
        }

        // ━━━━━━ Debug panel ━━━━━━
        //
        // dbg(tag, msg, level?) — level ∈ {ok, warn, err, info (default)}.
        // The panel is disabled by default in production builds. To
        // re-enable it temporarily, append `?debug=1` to the receiver
        // URL in the Cast Developer Console — `DEBUG_ALWAYS_VISIBLE`
        // below picks that up and forces the panel to render. The
        // scattered `dbg()` calls throughout the file are kept intact so
        // re-enabling is just a URL flag, not a code change.
        const DEBUG_ALWAYS_VISIBLE = (() => {
            try {
                return new URLSearchParams(location.search).get('debug') === '1';
            } catch (_) { return false; }
        })();
        const debugEl = document.getElementById('debug');
        const debugList = document.getElementById('debug-list');
        const DBG_MAX_ROWS = 30;
        const dbgRows = [];

        function dbg(tag, msg, level) {
            // Hard no-op unless ?debug=1 is set on the receiver URL.
            // Everything below would otherwise render the panel — gating
            // here keeps the call sites unchanged.
            if (!DEBUG_ALWAYS_VISIBLE) return;
            const now = new Date();
            const time = now.toTimeString().slice(0, 8) + '.' +
                String(now.getMilliseconds()).padStart(3, '0');
            const row = { time, tag, msg, level: level || 'info' };
            dbgRows.push(row);
            if (dbgRows.length > DBG_MAX_ROWS) dbgRows.shift();
            renderDebug();
            debugEl.classList.remove('hidden');
        }

        function renderDebug() {
            const html = dbgRows.map((r) => {
                const cls = r.level === 'info' ? '' : ` ${r.level}`;
                const safe = (s) => String(s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<div class="dbg-row${cls}">` +
                    `<span style="color:rgba(255,255,255,0.4)">${r.time}</span> ` +
                    `<span class="dbg-tag">${safe(r.tag)}</span>` +
                    `${safe(r.msg)}</div>`;
            }).join('');
            debugList.innerHTML = html;
        }

        function hideDebugSoon() {
            if (DEBUG_ALWAYS_VISIBLE) return;
            // Give the eye a couple of seconds to read the last events,
            // then quietly fade the panel out.
            setTimeout(() => debugEl.classList.add('hidden'), 2500);
        }

        // Mirror console errors to the debug panel so any uncaught JS lands
        // in the rolling log too.
        window.addEventListener('error', (ev) => {
            dbg('jserr', `${ev.message} @ ${ev.filename}:${ev.lineno}`, 'err');
        });

        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        // ━━━━━━ NiPa status channel (protocol v1) ━━━━━━
        //
        // CAF's media status can't tell the app what is going on: on the
        // hls.js path it stays BUFFERING while the picture plays, and a
        // failure is at best a LOAD_FAILED with no reason. Apps that speak
        // this protocol (from 1.5.1) get it on their own namespace:
        //   app → TV  {type:'hello', v, app, version, platform, locale}
        //   TV → app  {type:'hello', v, rx, caps}   what this device decodes
        //   TV → app  {type:'status', v, loadId, seq, state, pos, dur,
        //              wait?, failure?, stream}      on every change, and
        //              every 5 s while a channel is on
        // state: starting | waitingSlot | buffering | playing | paused |
        //        reconnecting | failed | ended
        // Never a URL. Older apps don't listen on the namespace: for them
        // nothing changes.
        //
        // Since 2026-11-17 (the hello's `features`):
        //   vodCauses: a movie or episode that fails says why, like a channel
        //              (`failure.format` names what the device can't play);
        //   queue:     app → TV {type:'queue', forLoadId, items, autoAdvance}
        //              plays the next episodes on the TV by itself, also while
        //              the phone sleeps (see "Episode queue").
        const NIPA_NS = 'urn:x-cast:com.nipaplayer.cast';
        const RX_VERSION = '2026-11-17.1';
        const RX_FEATURES = { vodCauses: 1, queue: 1 };
        let statusSeq = 0;
        let capsCache = null;

        function probeCaps() {
            if (capsCache) return capsCache;
            const mse = (type) => {
                try { return !!(window.MediaSource && MediaSource.isTypeSupported(type)); } catch (_) { return false; }
            };
            const shows = (codecs, w, h, fps) => {
                try { return !!context.canDisplayType('video/mp4', codecs, w, h, fps); } catch (_) { return null; }
            };
            // hls.js feeds MSE, so what MSE accepts is what plays.
            let h264MaxLevel = null;
            [['3.1', '1F'], ['4.0', '28'], ['4.1', '29'], ['4.2', '2A'], ['5.0', '32'], ['5.1', '33'], ['5.2', '34']]
                .forEach(([level, hex]) => { if (mse(`video/mp4; codecs="avc1.6400${hex}"`)) h264MaxLevel = level; });
            capsCache = {
                h264MaxLevel,
                fhd60: shows('avc1.64002A', 1920, 1080, 60),
                uhd: shows('avc1.640033', 3840, 2160, 30),
                hevc: mse('video/mp4; codecs="hvc1.1.6.L120.B0"'),
                ac3: mse('audio/mp4; codecs="ac-3"'),
                eac3: mse('audio/mp4; codecs="ec-3"'),
                // What hls.js reads out of MPEG-TS, whatever the device.
                tsVideo: ['h264'],
                // AAC with more than two channels: no type check tells, so
                // it's what this device showed with a file (null: not yet).
                aacMulti: typeof learned().aacMulti === 'boolean' ? learned().aacMulti : null,
            };
            return capsCache;
        }

        // What this device turned out to play or not, kept between launches.
        const LEARNED_KEY = 'nipa.caps.learned';
        function learned() {
            try { return JSON.parse(localStorage.getItem(LEARNED_KEY) || '{}') || {}; } catch (_) { return {}; }
        }
        function learn(key, value) {
            try {
                const l = learned();
                if (l[key] === value) return;
                l[key] = value;
                localStorage.setItem(LEARNED_KEY, JSON.stringify(l));
                capsCache = null;
            } catch (_) { /* storage off: asked again next time */ }
        }

        function sendToApps(msg, senderId) {
            try {
                context.sendCustomMessage(NIPA_NS, senderId, msg);
            } catch (e) {
                dbg('nipa', `send failed: ${e.message || e}`, 'warn');
            }
        }

        // What the app is told about session [s]; `extra` adds wait/failure.
        function statusOf(s, extra) {
            const live = s ? s.isLive : false;
            const q = s && s.queue;
            const queue = q ? { left: q.items.length, auto: q.autoAdvance, cancelled: q.cancelled } : undefined;
            const upNext = (q && q.shownLeft > 0 && q.items.length)
                ? { loadId: q.items[0].loadId, inSec: q.shownLeft, total: q.countdownSec } : undefined;
            return Object.assign({
                type: 'status', v: 1,
                loadId: s ? s.loadId : null,
                seq: ++statusSeq,
                state: s ? s.state : 'ended',
                pos: Math.floor(video.currentTime || 0),
                dur: (!live && isFinite(video.duration)) ? Math.floor(video.duration) : null,
                stream: s ? {
                    engine: s.engine,
                    via: s.via,
                    video: (video.videoWidth && video.videoHeight)
                        ? { w: video.videoWidth, h: video.videoHeight, codec: s.videoCodec || null }
                        : (s.videoCodec ? { codec: s.videoCodec } : null),
                    audioOnly: !!s.audioOnly,
                } : null,
                // A file still not open after a while (it will start on its own).
                slow: (s && s.slow) || undefined,
                queue,
                upNext,
            }, extra || {});
        }

        // Session [s] is now in [state]; tells the apps (the current
        // session only).
        function setState(s, state, extra) {
            if (!s || session !== s) return;
            s.state = state;
            s.lastExtra = extra || null;
            sendToApps(statusOf(s, extra));
        }

        context.addCustomMessageListener(NIPA_NS, (event) => {
            const data = event && event.data;
            if (data && data.type === 'queue') { onQueueMessage(data); return; }
            if (!data || data.type !== 'hello') return;
            dbg('nipa', `hello from ${data.app || '?'} ${data.version || '?'} (${data.platform || '?'})`);
            if (data.locale) applyLang(data.locale, true);
            sendToApps({ type: 'hello', v: 1, rx: RX_VERSION, caps: probeCaps(), features: RX_FEATURES }, event.senderId);
            // An app that (re)joins mid-channel learns where things stand,
            // and which queued episodes the TV played while it was away.
            if (session) sendToApps(statusOf(session, session.lastExtra), event.senderId);
            if (queueHistory.length || (session && session.queue)) sendToApps(queueState(), event.senderId);
        });

        // [keepElement]: CAF has already given the element its new source
        // (a LOAD the receiver made, routed by hand).
        function cleanup(keepElement) {
            endSession();
            hideNotice();
            hideUpNext();
            if (hls) { hls.destroy(); hls = null; }
            if (keepElement) return;
            video.removeAttribute('src');
            video.load();
        }

        // Brief stream summary: container, file size hint from URL, codecs
        // exposed by the video element once metadata loads.
        function urlSummary(url) {
            try {
                const u = new URL(url);
                const ext = (u.pathname.match(/\.[a-z0-9]{2,5}$/i) || ['?'])[0];
                return { host: u.host, ext: ext.toLowerCase(), path: u.pathname };
            } catch (_) {
                return { host: '?', ext: '?', path: '' };
            }
        }

        // ━━━━━━ Playback sessions ━━━━━━
        //
        // Each LOAD (or the on-TV Retry) starts a playback session. Its
        // timers and callbacks check `session === s` and bail once a newer
        // one replaced it, so a late retry for the previous channel never
        // touches the current one.
        //
        // On top of hls.js's own recovery, a session:
        //   * Waits out a provider that refuses the TV a connection (HTTP
        //     458 / 509 / 429). With one-connection IPTV plans the phone
        //     that just started casting still holds the slot for a minute
        //     or two after it stops. hls.js never retries a 4xx, and
        //     `startLoad()` can't reload a manifest that never loaded, so the
        //     TV used to sit on "Loading..." forever. Now the stream is
        //     rebuilt every few seconds for up to SLOT_WAIT_MS, with the
        //     reason on screen.
        //   * Ends every other playlist failure on a specific error screen
        //     (and LOAD_FAILED while CAF still waits) instead of "Loading...".
        //   * Fails at once, naming the format, when this device can't decode
        //     the channel (e.g. 1080p50 = H.264 level 4.2 on a 2nd-gen
        //     Chromecast).
        //   * Rebuilds the stream (live: at the live edge) after media errors
        //     and frozen playback, a few times before giving up.
        //   * Plays a live `.ts` LOAD through its `.m3u8` sibling, as raw
        //     MPEG-TS doesn't play here; the `.ts` itself is only the
        //     fallback when the provider has no HLS for the channel.
        const SLOT_WAIT_MS = 180000;
        const SLOT_RETRY_DELAYS_MS = [4000, 6000, 8000, 10000, 15000];
        const CONN_REFUSED_STATUSES = [458, 509, 429];
        const MAX_REBUILDS = 3;            // within REBUILD_WINDOW_MS
        const REBUILD_WINDOW_MS = 120000;
        const FROZEN_AFTER_MS = 25000;     // no progress while meant to play
        const NO_START_AFTER_MS = 45000;   // an attempt that never started

        let session = null;

        function newSession({ url, contentType, startTime, isLive }) {
            const prev = session;
            endSession();
            const s = {
                url, contentType, startTime, isLive,
                engine: null,          // 'hls' | 'native'
                hlsUrl: null,          // .m3u8 sibling of a live .ts LOAD
                request: null,         // CAF's LOAD request (hls engine)
                tsMedia: null,         // its original media fields, if rewritten
                settle: null,          // resolves CAF's pending LOAD, once
                attemptStartedAt: Date.now(),
                slotWaitStartedAt: 0,
                slotRetries: 0,
                rebuilds: [],          // timestamps, for the per-window cap
                totalRebuilds: 0,
                networkRecovered: false,
                codecMime: null,       // what a SourceBuffer refused
                hasPlayed: false,      // this session ever showed a picture
                attemptPlayed: false,  // the current hls.js attempt did
                emptyFrags: 0,         // fragments buffered with nothing playable
                loadId: nipaLoadId,    // the app's id for this LOAD (status channel)
                state: 'starting',     // what the status channel reports
                lastExtra: null,       // its wait / failure, for heartbeats
                via: null,             // 'm3u8' | 'ts-sibling' | 'ts-native' | 'native'
                videoCodec: null,      // e.g. avc1.640028, from the manifest
                audioOnly: false,
                failed: false,
                userPaused: false,
                lastProgressAt: Date.now(),
                lastProgressPos: 0,
                timers: new Set(),
                // The LOAD's customData (what a queued episode's LOAD copies).
                custom: lastCustom,
                // Native engine: each (re)load of the file is an attempt.
                attempt: 0,
                metadataAt: 0,
                classifying: false,   // reading the file to name a failure
                blindRetries: 0,      // reloads when the provider can't be asked
                slow: false,          // still not open after NATIVE_SLOW_MS
                audioChecked: false,
                audioContent: false,  // a file with sound and no picture, on purpose
                // The episodes that follow, played by the TV itself.
                queue: null,
            };
            if (carriedQueue && carriedQueue.forLoadId === s.loadId) {
                s.queue = Object.assign({}, carriedQueue, { cancelled: false, anchor: -1, shownLeft: 0 });
            } else if (prev && prev.queue && prev.loadId && prev.loadId === s.loadId) {
                // The same LOAD again (Retry on the TV): its queue stays.
                s.queue = prev.queue;
            }
            carriedQueue = null;
            session = s;
            return s;
        }

        function endSession() {
            const s = session;
            if (!s) return;
            session = null;
            s.timers.forEach(clearTimeout);
            s.timers.clear();
            // Never leave CAF waiting on a LOAD nobody will settle.
            settleOk(s);
        }

        function later(s, ms, fn) {
            const id = setTimeout(() => {
                s.timers.delete(id);
                if (session === s) fn();
            }, ms);
            s.timers.add(id);
        }

        function loadFailedError() {
            const err = new cast.framework.messages.ErrorData(
                cast.framework.messages.ErrorType.LOAD_FAILED
            );
            err.reason = cast.framework.messages.ErrorReason.GENERIC_LOAD_ERROR;
            return err;
        }

        // Settle CAF's pending LOAD (if any) exactly once.
        function settleOk(s, request) {
            if (!s.settle) return;
            const resolve = s.settle;
            s.settle = null;
            resolve(request || s.request);
        }
        function settleFail(s) {
            if (!s.settle) return;
            const resolve = s.settle;
            s.settle = null;
            resolve(loadFailedError());
        }

        // Called from inside hls.js's own event callbacks (ERROR,
        // BUFFER_CODECS…): destroying it there makes the code that emitted the
        // event crash on the torn-down instance ("Cannot read property
        // 'trigger' of null"). Detach it now — our handlers check `hls` — and
        // destroy it once that code has returned. (cleanup() and startHls()
        // never run inside a callback and destroy synchronously.)
        function dropHls() {
            const h = hls;
            if (!h) return;
            hls = null;
            setTimeout(() => {
                try { h.destroy(); } catch (e) { dbg('hls', `destroy: ${e.message || e}`, 'warn'); }
            }, 0);
        }

        // Terminal: error screen, and LOAD_FAILED if CAF still waits (the
        // sender then reports the failure instead of "casting").
        // [reason] is what the status channel reports when the screen's
        // [kind] doesn't say it (frozen, never started, network…).
        function failSession(s, { kind, codeLine, detail, status, reason, subtitle, format } = {}) {
            if (session !== s || s.failed) return;
            s.failed = true;
            s.timers.forEach(clearTimeout);
            s.timers.clear();
            dropHls();
            hideUpNext();
            dbg('fail', `${kind || 'generic'} · ${codeLine || '-'}`, 'err');
            showError({ kind: kind || reason, codeLine, detail, status, subtitle });
            const failure = { kind: reason || kind || 'network' };
            if (status) failure.http = status;
            if (kind === 'codec' && s.codecMime) failure.detail = s.codecMime;
            // What in the file this device can't play: { part, name }.
            if (format) failure.format = format;
            setState(s, 'failed', { failure });
            settleLoadForFailure(s);
        }

        // Whether a failure fails CAF's LOAD. Senders that handle it say so
        // (`features.loadFailure`, from app 1.5.1) and get LOAD_FAILED. Older
        // ones (≤ 1.5.0) disconnect on it — taking the explanation off the TV
        // within seconds — and mishandle a channel switch made in the
        // meantime (a stale delayed disconnect kills the new channel; a load
        // that times out after that disconnect leaves them "casting" with no
        // session). For them the LOAD succeeds and the screen explains; the
        // session stays up, so picking another channel just works.
        // Apps on the status channel (`features.nipaStatus`) learn the
        // failure there; their LOAD was resolved at once.
        function settleLoadForFailure(s) {
            if (feature('loadFailure') && !feature('nipaStatus')) settleFail(s);
            else settleOk(s);
        }

        const isTsUrl = (u) => /\.ts(?=$|[?#])/i.test(u);
        const tsToM3u8 = (u) => u.replace(/\.ts(?=$|[?#])/i, '.m3u8');
        // Catch-up/timeshift is `.ts` only (no HLS sibling); senders never
        // cast it, but don't rewrite it if one ever does.
        const isLiveTs = (url, isLive) => isLive && isTsUrl(url) && !/timeshift/i.test(url);

        function httpKind(status) {
            if (status === 401 || status === 403 || status === 407) return 'auth';
            if (status === 404 || status === 410) return 'notFound';
            if (status >= 500 && status < 600) return 'serverError';
            return undefined;
        }

        function errorLine(data, status) {
            return [
                (data.type || 'ERROR').replace('Error', '').toUpperCase(),
                data.details || 'unknown',
                status ? `HTTP ${status}` : null,
            ].filter(Boolean).join(' · ');
        }

        // "video/mp4;codecs=avc1.4d402a" → human wording for the error screen.
        function describeFormat(mime) {
            const m = /codecs="?([^",;]+)/i.exec(mime || '');
            const codec = m ? m[1] : '';
            const avc = /^avc[13]\.[0-9a-f]{4}([0-9a-f]{2})$/i.exec(codec);
            if (avc) {
                const level = parseInt(avc[1], 16) / 10;
                return level >= 4.2
                    ? t('formatAvcHighLevel').replace('{level}', level.toFixed(1))
                    : `H.264 (${codec})`;
            }
            if (/^(hvc1|hev1)/i.test(codec)) return 'HEVC (H.265)';
            if (/^av01/i.test(codec)) return 'AV1';
            return codec;
        }
        function codecFailure(s) {
            const format = describeFormat(s.codecMime);
            return {
                kind: 'codec',
                codeLine: `INCOMPATIBLE CODEC · ${s.codecMime || '?'}`,
                detail: format ? t('codecDetail').replace('{format}', format) : '',
            };
        }

        // ━━━━━━ LOAD interceptor (IPTV-first router) ━━━━━━
        //
        // Engine routing:
        //   * .m3u8 / mpegurl, and live .ts (via its .m3u8) → hls.js (takes
        //     control of <video> via MSE)
        //   * everything else (.mp4, .mkv, .mov…) → let CAF assign video.src
        //     itself. We don't touch the element, just attach listeners. This
        //     avoids the duplicate load that happened when both we *and* CAF
        //     were setting video.src.
        //
        // LOAD promise resolution:
        //   * HLS: resolved on the video element's first `playing` event, or
        //     with LOAD_FAILED on a terminal failure, or optimistically after
        //     20 s (a provider wait keeps going after that).
        //   * Native: resolved immediately with `request`. CAF then loads
        //     the src itself, single-pass. The sender shows "casting" a
        //     couple of seconds before the picture appears — the
        //     trade-off for never restarting mid-load.
        // LOADs the receiver makes itself: the same file again (a provider
        // wait, a reload after a break) and the next queued episode. Whether
        // CAF passes a LOAD made by the page through this interceptor isn't
        // documented, so both ways are handled: a reload needs no routing, and
        // a queued episode CAF loaded on its own is followed by hand.
        let pendingReload = null;     // token of the reload on its way
        let pendingQueued = null;     // load id of the queued episode on its way
        let lastRequest = null;       // the last LOAD, for the TV's own Retry

        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            (request) => handleLoad(request)
        );

        // [byHand]: CAF has already given the element [request]'s file.
        function handleLoad(request, byHand) {
            const custom = request.customData || {};
            if (custom.nipaInternal && custom.nipaInternal === pendingReload) {
                // The same file for the session that asked: nothing to route.
                pendingReload = null;
                dbg('LOAD', 'the same file again', 'ok');
                return Promise.resolve(request);
            }
            const url = request.media.contentUrl || request.media.contentId;
            const contentType = (request.media.contentType || '').toLowerCase();
            const startTime = request.currentTime || 0;
            const isLive = request.media.streamType === cast.framework.messages.StreamType.LIVE;
            const isHls = !!url && (url.includes('.m3u8') || contentType.includes('mpegurl'));
            const liveTs = !!url && !isHls && isLiveTs(url, isLive);
            const viaHls = (isHls || liveTs) && !!window.Hls && Hls.isSupported();

            cleanup(byHand && !viaHls);
            hideError();
            // The sender's language before anything is drawn.
            readSenderHandshake(request);
            if (pendingQueued && nipaLoadId === pendingQueued) pendingQueued = null;
            showLoading(t('loading'));
            // Reset the debug log so it shows only the current attempt.
            dbgRows.length = 0;
            renderDebug();

            if (!url) {
                dbg('LOAD', 'request had no URL', 'err');
                return request;
            }

            const sum = urlSummary(url);
            dbg('LOAD', `${sum.host} ${sum.ext} ct=${contentType || '-'} t=${startTime}s${isLive ? ' live' : ''}`);
            lastKnownTime = 0;
            armStartTimeGuard(startTime);

            lastLoad = { url, startTime, contentType, isLive };
            lastRequest = request;

            if (isHls || liveTs) {
                if (!window.Hls) {
                    // Neither the vendored copy nor the CDN fallback loaded.
                    const s = newSession({ url, contentType, startTime, isLive });
                    failSession(s, { kind: 'playerLoad', codeLine: 'HLS.JS NOT LOADED' });
                    // As settleLoadForFailure(): only senders that handle
                    // a failed LOAD get one. An HLS request resolved with
                    // skipPlayersLoad leaves the element (and the error
                    // screen) alone.
                    return (feature('loadFailure') && !feature('nipaStatus')) ? loadFailedError() : request;
                }
                if (Hls.isSupported()) {
                    return loadWithHlsJs(request, { url, contentType, startTime, isLive, liveTs });
                }
            }
            if (isHls && video.canPlayType('application/vnd.apple.mpegurl')) {
                dbg('engine', 'native HLS', 'ok');
            } else {
                dbg('engine', `native (${sum.ext})`, 'ok');
            }
            const ns = newSession({ url, contentType, startTime, isLive });
            ns.via = 'native';
            ns.request = request;
            startNativeAttempt(ns);
            setState(ns, 'starting');
            // Resolved at once: CAF gives the element the file itself.
            dbg('LOAD', 'native: CAF loads the file', 'ok');
            return Promise.resolve(request);
        }

        // ━━━━━━ Native engine (movies and episodes) ━━━━━━
        //
        // CAF gives the <video> the file once the LOAD resolves. All the TV's
        // player says when it can't is MediaError 4, whatever the reason, so:
        //   * a failure is named by reading the file once the element has let
        //     go of it (see "What a file holds"): the provider's answer (a
        //     busy account, refused, gone, a page instead of a video), else
        //     the format this device can't play;
        //   * a provider still holding the account's connection is waited out,
        //     as on the channel path (status-channel apps);
        //   * a file that plays sound over black (HEVC, Xvid…) is stopped and
        //     named after a few seconds, unless it has no picture at all;
        //   * a file slow to open says so, and fails after NATIVE_NO_START_MS.
        // Reloads go back through CAF (playerManager.load) so the app keeps
        // control of the new media session. Only apps on the status channel
        // get them: older ones follow their own LOAD only, and get the named
        // failure instead.
        const NATIVE_SLOW_MS = 12000;
        const NATIVE_NO_START_MS = 120000;
        const PICTURE_CHECK_MS = 3000;
        const NATIVE_BLIND_RETRIES = 3;
        const canReload = () => feature('nipaStatus');
        const isNative = (s) => !!s && s.engine === 'native' && s.via !== 'ts-native';

        // A (re)load of the file begins.
        function startNativeAttempt(s) {
            s.engine = 'native';
            s.attempt += 1;
            s.metadataAt = 0;
            s.classifying = false;
            s.audioChecked = false;
            s.slow = false;
            s.attemptStartedAt = Date.now();
            const attempt = s.attempt;
            const opening = () => session === s && s.attempt === attempt && !s.metadataAt &&
                !s.failed && !s.classifying && s.state !== 'waitingSlot';
            later(s, NATIVE_SLOW_MS, () => {
                if (!opening()) return;
                s.slow = true;
                dbg('native', `not open after ${NATIVE_SLOW_MS / 1000}s`, 'warn');
                showLoading(t('slowTitle'), t('slowDetail'));
                setState(s, s.state, s.lastExtra);
            });
            later(s, NATIVE_NO_START_MS, () => {
                if (opening()) classifyNative(s, 'noStart');
            });
        }

        video.addEventListener('loadedmetadata', () => {
            const s = session;
            if (!isNative(s) || s.classifying) return;
            s.metadataAt = Date.now();
            if (s.slow) {
                s.slow = false;
                showLoading(t('buffering'));
            }
            if (s.slotWaitStartedAt) {
                dbg('slot', `provider accepted after ${Math.round((Date.now() - s.slotWaitStartedAt) / 1000)}s`, 'ok');
                s.slotWaitStartedAt = 0;
                s.slotRetries = 0;
            }
            if (['starting', 'waitingSlot', 'reconnecting'].includes(s.state)) setState(s, 'buffering');
            // No picture size in the metadata: this device can't decode the
            // video (HEVC, Xvid…), or the file has none. Stopped before a
            // sound is heard: sound over black, then an error, looked like
            // the app failing (Pablo, 17-nov). The 3 s check stays for files
            // that give a size and still show nothing.
            if (canReload() && !s.audioContent && !video.videoWidth && !video.videoHeight) {
                dbg('native', 'no picture size in the metadata', 'warn');
                classifyNative(s, 'audioOnly');
            }
        });

        video.addEventListener('error', () => {
            const s = session;
            if (!isNative(s) || s.failed || s.classifying) return;
            classifyNative(s, 'error');
        });

        video.addEventListener('playing', () => {
            const s = session;
            if (!isNative(s) || s.audioChecked || s.audioContent) return;
            const attempt = s.attempt;
            later(s, PICTURE_CHECK_MS, () => checkPicture(s, attempt));
        });

        // Sound with no picture after a few seconds of playing.
        function checkPicture(s, attempt) {
            if (session !== s || s.attempt !== attempt || s.failed || s.classifying || s.audioChecked) return;
            // Not really playing yet: the next `playing` checks again.
            if (video.paused || !(video.currentTime > 0)) return;
            s.audioChecked = true;
            if (video.videoWidth > 0 || video.webkitDecodedFrameCount > 0) return;
            dbg('native', 'sound with no picture', 'warn');
            if (!canReload()) {
                // Older apps: said over the sound, as on the channel path.
                showNotice(t('audioOnly'));
                s.audioOnly = true;
                setState(s, s.state, s.lastExtra);
                return;
            }
            classifyNative(s, 'audioOnly');
        }

        function stopNative() {
            try { video.pause(); } catch (_) { /* nothing loaded */ }
            video.removeAttribute('src');
            video.load();
        }

        // Why the file didn't play, from what the provider sends for it.
        // [why]: 'error' (MediaError), 'audioOnly' (no picture), 'noStart'.
        async function classifyNative(s, why) {
            if (session !== s || s.failed || s.classifying) return;
            s.classifying = true;
            s.slow = false;
            const attempt = s.attempt;
            const err = video.error;
            const code = err ? err.code : 0;
            const msg = (err && err.message) || '';
            const afterMetadata = !!s.metadataAt;
            const at = s.hasPlayed ? Math.floor(lastKnownTime) : s.startTime;
            dbg('native', `${why}${code ? ` · MediaError ${code}` : ''}${msg ? ` "${msg}"` : ''} → reading the file`, 'warn');
            // The element lets go of the connection first: with a one-connection
            // account the read would be refused, or cut the picture.
            stopNative();
            const head = await probeHead(s.url);
            if (session !== s || s.attempt !== attempt || s.failed) return;
            s.classifying = false;
            const status = head.status;
            const m = (head.media && !head.media.unknown) ? head.media : null;
            dbg('head', `HTTP ${status || '-'} · ${m ? describeMedia(m) : (head.error || (head.media && head.media.indexAtEnd ? 'mp4, index at the end' : 'format not read'))}`);
            const codeLine = (extra) => [code ? `MEDIA_ERROR ${code}` : why.toUpperCase(), extra].filter(Boolean).join(' · ');

            if (CONN_REFUSED_STATUSES.includes(status)) {
                if (canReload()) { waitForSlotNative(s, status, at); return; }
                failSession(s, { kind: status === 429 ? 'rateLimit' : 'connLimit', codeLine: `PROVIDER REFUSED · HTTP ${status}`, status });
                return;
            }
            const kind = httpKind(status);
            if (kind) {
                failSession(s, { kind, codeLine: codeLine(`HTTP ${status}`), status });
                return;
            }
            if (status >= 200 && status < 300) {
                if (head.html) {
                    failSession(s, { kind: 'notVideo', codeLine: codeLine(`HTTP ${status} · NOT A VIDEO`) });
                    return;
                }
                if (why === 'audioOnly' && m && !m.video) {
                    // Sound only on purpose: carry on where it was.
                    s.audioContent = true;
                    reloadNative(s, at);
                    return;
                }
                const problem = m ? formatProblem(m, { soundPlayed: why === 'audioOnly' && s.hasPlayed }) : null;
                if (problem || why === 'audioOnly') {
                    // No picture with nothing named is still about the picture.
                    const p = problem || (m && m.video ? { part: 'video', name: videoName(m.video), codec: m.video.codec } : null);
                    if (p && p.part === 'audio' && p.codec === 'aac') learn('aacMulti', false);
                    failSession(s, {
                        kind: 'vodCodec',
                        reason: 'codec',
                        format: p ? { part: p.part, name: p.name } : undefined,
                        subtitle: p ? t(p.part === 'video' ? 'vodVideoSubtitle' : 'vodAudioSubtitle').replace('{format}', p.name) : undefined,
                        codeLine: codeLine(p ? `${p.part.toUpperCase()} ${p.name}` : 'NO PICTURE'),
                    });
                    return;
                }
                // Reachable, and nothing in it known to be a problem.
                if (s.hasPlayed && canReload() && rebuildNative(s, at, `${why} after playing`)) return;
                if (why === 'noStart') {
                    failSession(s, { kind: 'stalled', reason: 'noPlayback', codeLine: 'NO PLAYBACK' });
                    return;
                }
                if (afterMetadata || code === 3 || code === 4) {
                    failSession(s, { kind: 'vodCodec', reason: 'codec', codeLine: codeLine(m ? describeMedia(m) : '') });
                    return;
                }
                failSession(s, { codeLine: codeLine(), reason: 'media' });
                return;
            }
            // The provider couldn't be asked (no CORS headers, network down).
            // Before the file opened, that's often the account still held
            // for a moment: a few plain reloads first.
            if (!afterMetadata && !s.hasPlayed && canReload() && s.blindRetries < NATIVE_BLIND_RETRIES) {
                s.blindRetries += 1;
                dbg('native', `provider not readable (${head.error || status}) → reload #${s.blindRetries}`, 'warn');
                showLoading(t('retrying'));
                later(s, 4000 * s.blindRetries, () => reloadNative(s, at));
                return;
            }
            if (s.hasPlayed && canReload() && rebuildNative(s, at, `${why} after playing`)) return;
            failSession(s, {
                kind: afterMetadata ? 'vodCodec' : undefined,
                reason: afterMetadata ? 'codec' : 'media',
                codeLine: codeLine(head.error ? String(head.error).toUpperCase() : ''),
            });
        }

        // The provider refuses the TV a connection: ask again now and then
        // (only the headers, cut at once) and reload the file once it agrees.
        function waitForSlotNative(s, status, at) {
            const now = Date.now();
            if (!s.slotWaitStartedAt) {
                s.slotWaitStartedAt = now;
                dbg('slot', `HTTP ${status} → waiting for the provider to free the connection`, 'warn');
            }
            if (now - s.slotWaitStartedAt >= SLOT_WAIT_MS) {
                failSession(s, {
                    kind: status === 429 ? 'rateLimit' : 'connLimit',
                    codeLine: `PROVIDER REFUSED · HTTP ${status}`,
                    status,
                });
                return;
            }
            showLoading(t('waitingProviderTitle'), t('waitingProviderDetail'));
            s.slotStatus = status;
            setState(s, 'waitingSlot', { wait: slotWait(s) });
            const delay = SLOT_RETRY_DELAYS_MS[Math.min(s.slotRetries, SLOT_RETRY_DELAYS_MS.length - 1)];
            s.slotRetries += 1;
            later(s, delay, async () => {
                const waited = Math.round((Date.now() - s.slotWaitStartedAt) / 1000);
                const head = await probeHead(s.url, { statusOnly: true });
                if (session !== s || s.failed) return;
                dbg('slot', `retry #${s.slotRetries} after ${waited}s: HTTP ${head.status || '-'}`);
                if (CONN_REFUSED_STATUSES.includes(head.status)) {
                    waitForSlotNative(s, head.status, at);
                    return;
                }
                // Free (or another answer, which the reload's own failure names).
                reloadNative(s, at);
            });
        }

        // It played, then broke (network, the provider closing it): reload
        // where it was, a few times per window.
        function rebuildNative(s, at, reason) {
            const now = Date.now();
            s.rebuilds = s.rebuilds.filter((x) => now - x < REBUILD_WINDOW_MS);
            if (s.rebuilds.length >= MAX_REBUILDS) return false;
            s.rebuilds.push(now);
            s.totalRebuilds += 1;
            dbg('recover', `${reason} → reloading at ${at}s (#${s.rebuilds.length})`, 'warn');
            showLoading(t('reconnecting'));
            setState(s, 'reconnecting');
            later(s, 1000, () => reloadNative(s, at));
            return true;
        }

        // The same file again, through CAF, from [at] seconds.
        function reloadNative(s, at) {
            if (session !== s || s.failed) return;
            startNativeAttempt(s);
            const M = cast.framework.messages;
            const req = new M.LoadRequestData();
            req.media = s.request.media;
            req.autoplay = true;
            req.currentTime = at > 0 ? at : 0;
            pendingReload = `r${s.attempt}.${Date.now()}`;
            req.customData = Object.assign({}, s.request.customData || {}, { nipaInternal: pendingReload });
            armStartTimeGuard(req.currentTime);
            dbg('native', `reload at ${req.currentTime}s`);
            try {
                const p = playerManager.load(req);
                if (p && p.catch) p.catch((e) => dbg('native', `reload: ${(e && e.message) || e}`, 'warn'));
            } catch (e) {
                dbg('native', `reload threw: ${(e && e.message) || e}`, 'err');
            }
        }

        // ━━━━━━ What a file holds (on-demand failures) ━━━━━━
        //
        // When the TV's own player can't play a movie or an episode it only
        // says MEDIA_ERR_SRC_NOT_SUPPORTED, whatever the reason: the provider
        // refusing a second connection (HTTP 458), a picture this device can't
        // decode (HEVC, Xvid), a sound it can't (AAC 5.1 on a 2nd-gen
        // Chromecast)... Once the element has let go of the connection, the
        // receiver reads the start of the file itself and names the cause.
        //
        // A plain GET, cut once the header is in: providers' CORS preflight
        // refuses a Range header on these Chromecasts (Chrome 90), so the
        // read always starts at byte 0. MP4 is only understood when its index
        // (moov) is at the start.
        const HEAD_BYTES = 262144;          // Matroska, AVI, TS: tracks come first
        const HEAD_BYTES_MP4 = 2097152;     // MP4: a long movie's index is bigger
        const HEAD_TIMEOUT_MS = 10000;

        // → { status, html?, media? } or { status: 0, error } when the provider
        // can't be asked (no CORS headers, network). [statusOnly]: the answer
        // alone, cut as soon as it comes (asking a busy provider again).
        async function probeHead(url, { statusOnly } = {}) {
            const ac = (typeof AbortController === 'function') ? new AbortController() : null;
            const timer = setTimeout(() => { if (ac) ac.abort(); }, HEAD_TIMEOUT_MS);
            try {
                const r = await fetch(url, ac ? { signal: ac.signal } : {});
                if (!r.ok || statusOnly) return { status: r.status };
                if (!r.body || !r.body.getReader) return { status: r.status };
                const reader = r.body.getReader();
                const parts = [];
                let n = 0;
                let want = HEAD_BYTES;
                for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    parts.push(value);
                    n += value.length;
                    if (n >= 8 && want === HEAD_BYTES && isMp4Start(parts[0])) want = HEAD_BYTES_MP4;
                    if (n >= want) break;
                    if (want === HEAD_BYTES_MP4 && n >= 65536 && mp4IndexDone(joinBytes(parts, n))) break;
                }
                try { reader.cancel(); } catch (_) { /* gone */ }
                const bytes = joinBytes(parts, n);
                return { status: r.status, html: looksLikeHtml(bytes), media: parseMediaHead(bytes) };
            } catch (e) {
                return { status: 0, error: String((e && e.name) || e) };
            } finally {
                clearTimeout(timer);
                if (ac) { try { ac.abort(); } catch (_) { /* done */ } }
            }
        }

        function joinBytes(parts, n) {
            const out = new Uint8Array(n);
            let o = 0;
            for (const p of parts) { out.set(p.subarray(0, Math.min(p.length, n - o)), o); o += p.length; if (o >= n) break; }
            return out;
        }
        const ascii = (b, at, len) => {
            let out = '';
            const end = Math.min(b.length, at + len);
            for (let i = at; i < end; i++) out += String.fromCharCode(b[i]);
            return out;
        };
        const u32 = (b, at) => ((b[at] << 24) >>> 0) + (b[at + 1] << 16) + (b[at + 2] << 8) + b[at + 3];
        const u16 = (b, at) => (b[at] << 8) + b[at + 1];
        const isMp4Start = (b) => b.length >= 8 && ['ftyp', 'moov', 'free', 'skip', 'mdat', 'wide'].includes(ascii(b, 4, 4));
        function looksLikeHtml(b) {
            const head = ascii(b, 0, Math.min(b.length, 256)).trim().toLowerCase();
            return head.startsWith('<!doctype') || head.startsWith('<html') || head.startsWith('<?xml') || head.startsWith('{');
        }

        // ── Matroska / WebM ──
        function ebmlVint(b, p, keepMarker) {
            const first = b[p];
            if (first === undefined) return null;
            let len = 1, mask = 0x80;
            while (len <= 8 && !(first & mask)) { len++; mask >>= 1; }
            if (len > 8 || p + len > b.length) return null;
            let v = keepMarker ? first : (first & (mask - 1));
            for (let i = 1; i < len; i++) v = v * 256 + b[p + i];
            return { v, len };
        }
        function parseMatroska(b) {
            const tracks = [];
            let cur = null;
            const CONTAINERS = new Set([0x1654AE6B, 0xE0, 0xE1]);   // Tracks, Video, Audio
            const walk = (p, end) => {
                while (p < end && p < b.length - 2) {
                    const id = ebmlVint(b, p, true); if (!id) return true;
                    const size = ebmlVint(b, p + id.len, false); if (!size) return true;
                    const body = p + id.len + size.len;
                    const bodyEnd = Math.min(body + size.v, b.length);
                    if (id.v === 0x1F43B675) return true;              // first Cluster: tracks are behind us
                    if (id.v === 0x18538067) return walk(body, b.length); // Segment (size may be unknown)
                    if (CONTAINERS.has(id.v)) { if (walk(body, bodyEnd)) return true; }
                    else if (id.v === 0xAE) { cur = {}; tracks.push(cur); walk(body, bodyEnd); }
                    else if (cur) {
                        const raw = b.subarray(body, bodyEnd);
                        const uint = () => { let x = 0; for (const c of raw) x = x * 256 + c; return x; };
                        if (id.v === 0x83) cur.type = uint();
                        else if (id.v === 0x86) cur.codec = ascii(raw, 0, raw.length);
                        else if (id.v === 0x63A2) cur.priv = raw;
                        else if (id.v === 0x9F) cur.channels = uint();
                        else if (id.v === 0xB0) cur.w = uint();
                        else if (id.v === 0xBA) cur.h = uint();
                        else if (id.v === 0x6264) cur.bits = uint();
                        else if (id.v === 0x88) cur.isDefault = uint() === 1;
                        else if (id.v === 0x22B59C) cur.lang = ascii(raw, 0, raw.length);
                    }
                    p = body + size.v;
                }
                return false;
            };
            walk(0, b.length);
            const out = { container: 'mkv', video: null, audio: [], text: 0 };
            for (const t of tracks) {
                const c = t.codec || '';
                if (t.type === 1 && !out.video) {
                    const v = { codec: 'other', id: c, w: t.w || 0, h: t.h || 0 };
                    if (c === 'V_MPEG4/ISO/AVC') Object.assign(v, avcConfig(t.priv), { codec: 'h264' });
                    else if (c === 'V_MPEGH/ISO/HEVC') Object.assign(v, hevcConfig(t.priv), { codec: 'hevc' });
                    else if (/^V_MPEG4\/(ISO\/(ASP|SP|AP)|MS\/V3)/.test(c)) v.codec = 'mpeg4';
                    else if (/^V_MPEG(1|2)$/.test(c)) v.codec = 'mpeg2';
                    else if (c === 'V_VP9') v.codec = 'vp9';
                    else if (c === 'V_VP8') v.codec = 'vp8';
                    else if (c === 'V_AV1') v.codec = 'av1';
                    else if (c === 'V_MS/VFW/FOURCC') v.codec = vfwCodec(t.priv);
                    if (t.bits && !v.bits) v.bits = t.bits;
                    out.video = v;
                } else if (t.type === 2) {
                    const a = { codec: 'other', id: c, channels: t.channels || 0, lang: t.lang || null, isDefault: t.isDefault !== false };
                    if (c === 'A_AAC' || /^A_AAC\//.test(c)) Object.assign(a, { codec: 'aac' }, aacConfig(t.priv));
                    else if (c === 'A_AC3') a.codec = 'ac3';
                    else if (c === 'A_EAC3') a.codec = 'eac3';
                    else if (/^A_DTS/.test(c)) a.codec = 'dts';
                    else if (c === 'A_TRUEHD') a.codec = 'truehd';
                    else if (c === 'A_MPEG/L3') a.codec = 'mp3';
                    else if (c === 'A_MPEG/L2' || c === 'A_MPEG/L1') a.codec = 'mp2';
                    else if (c === 'A_OPUS') a.codec = 'opus';
                    else if (c === 'A_VORBIS') a.codec = 'vorbis';
                    else if (c === 'A_FLAC') a.codec = 'flac';
