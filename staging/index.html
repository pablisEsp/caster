                    else if (/^A_PCM/.test(c)) a.codec = 'pcm';
                    if (!a.channels && t.channels) a.channels = t.channels;
                    out.audio.push(a);
                } else if (t.type === 17) out.text++;
            }
            return (out.video || out.audio.length) ? out : { container: 'mkv', unknown: true };
        }
        // AVCDecoderConfigurationRecord: profile, level.
        function avcConfig(p) {
            if (!p || p.length < 4 || p[0] !== 1) return {};
            const profile = p[1];
            return { profile, level: p[3] / 10, bits: [110, 122, 244].includes(profile) ? 10 : 8 };
        }
        // HEVCDecoderConfigurationRecord: profile (2 = Main 10), level (×30).
        function hevcConfig(p) {
            if (!p || p.length < 13) return {};
            const profile = p[1] & 0x1f;
            return { profile, level: p[12] / 30, bits: profile === 2 ? 10 : 8 };
        }
        // AudioSpecificConfig: object type, channel configuration, HE (SBR).
        function aacConfig(p) {
            if (!p || p.length < 2) return {};
            const aot = p[0] >> 3;
            const ch = (p[1] >> 3) & 15;
            const sync = p.length >= 5 && ((p[2] << 3) | (p[3] >> 5)) === 0x2b7 && [5, 29].includes(p[3] & 31) && (p[4] >> 7) === 1;
            const channels = ch === 7 ? 8 : ch;   // configuration 7 = 7.1
            return { channels, he: aot === 5 || aot === 29 || sync };
        }
        // BITMAPINFOHEADER inside Matroska's V_MS/VFW/FOURCC and AVI: the fourcc.
        function vfwCodec(p) {
            if (!p || p.length < 20) return 'other';
            return fourccCodec(ascii(p, 16, 4));
        }
        function fourccCodec(cc) {
            const f = (cc || '').toUpperCase();
            if (['XVID', 'DIVX', 'DX50', 'DIV3', 'DIV4', 'FMP4', 'MP4V', 'M4S2', 'MP42', 'MP43'].includes(f)) return 'mpeg4';
            if (['H264', 'AVC1', 'X264'].includes(f)) return 'h264';
            if (['HEVC', 'H265', 'HVC1', 'HEV1'].includes(f)) return 'hevc';
            if (['MPG2', 'MPEG', 'MPG1'].includes(f)) return 'mpeg2';
            if (['WVC1', 'WMV3', 'WMV2', 'WMV1'].includes(f)) return 'vc1';
            return 'other';
        }

        // ── MP4 / MOV ──
        function mp4Boxes(b, p, end, fn) {
            while (p + 8 <= end) {
                let size = u32(b, p);
                const type = ascii(b, p + 4, 4);
                let hdr = 8;
                if (size === 1) { if (p + 16 > end) return; size = u32(b, p + 8) * 4294967296 + u32(b, p + 12); hdr = 16; }
                if (size === 0) size = end - p;
                if (size < hdr) return;
                if (fn(type, p + hdr, Math.min(p + size, end), p, size) === false) return;
                p += size;
            }
        }
        function mp4IndexDone(b) {
            let done = false;
            mp4Boxes(b, 0, b.length, (type, body, end, at, size) => {
                if (type === 'moov') { done = at + size <= b.length; return false; }
                if (type === 'mdat') { done = true; return false; }   // index at the end: nothing more to read
                return true;
            });
            return done;
        }
        function parseMp4(b) {
            let moov = null, mdatFirst = false;
            mp4Boxes(b, 0, b.length, (type, body, end) => {
                if (type === 'moov') { moov = [body, end]; return false; }
                if (type === 'mdat') { mdatFirst = true; return false; }
                return true;
            });
            if (!moov) return { container: 'mp4', unknown: true, indexAtEnd: mdatFirst };
            const out = { container: 'mp4', video: null, audio: [], text: 0 };
            const child = (p, end, name) => { let r = null; mp4Boxes(b, p, end, (t, cb, ce) => { if (t === name) { r = [cb, ce]; return false; } return true; }); return r; };
            mp4Boxes(b, moov[0], moov[1], (type, tb, te) => {
                if (type !== 'trak') return true;
                const mdia = child(tb, te, 'mdia'); if (!mdia) return true;
                const minf = child(mdia[0], mdia[1], 'minf'); if (!minf) return true;
                const stbl = child(minf[0], minf[1], 'stbl'); if (!stbl) return true;
                const stsd = child(stbl[0], stbl[1], 'stsd'); if (!stsd) return true;
                mp4Boxes(b, stsd[0] + 8, stsd[1], (fmt, eb, ee) => {
                    if (['avc1', 'avc3', 'hvc1', 'hev1', 'mp4v', 'av01', 'vp09', 'dvh1', 'dvhe'].includes(fmt)) {
                        if (out.video) return false;
                        const v = { codec: { avc1: 'h264', avc3: 'h264', hvc1: 'hevc', hev1: 'hevc', dvh1: 'hevc', dvhe: 'hevc', mp4v: 'mpeg4', av01: 'av1', vp09: 'vp9' }[fmt], w: u16(b, eb + 24), h: u16(b, eb + 26) };
                        mp4Boxes(b, eb + 78, ee, (ct, cb, ce) => {
                            if (ct === 'avcC') Object.assign(v, avcConfig(b.subarray(cb, ce)));
                            if (ct === 'hvcC') Object.assign(v, hevcConfig(b.subarray(cb, ce)));
                            return true;
                        });
                        out.video = v;
                    } else if (['mp4a', 'ac-3', 'ec-3', 'Opus', '.mp3', 'dtsc', 'dtsh', 'dtsl', 'fLaC', 'mlpa'].includes(fmt)) {
                        const a = { codec: { mp4a: 'aac', 'ac-3': 'ac3', 'ec-3': 'eac3', Opus: 'opus', '.mp3': 'mp3', dtsc: 'dts', dtsh: 'dts', dtsl: 'dts', fLaC: 'flac', mlpa: 'truehd' }[fmt], channels: u16(b, eb + 16), isDefault: true };
                        // QuickTime sound descriptions v1/v2 are longer before their boxes.
                        const soundVersion = u16(b, eb + 8);
                        const boxesAt = eb + (soundVersion === 1 ? 44 : soundVersion === 2 ? 64 : 28);
                        if (fmt === 'mp4a') {
                            mp4Boxes(b, boxesAt, ee, (ct, cb, ce) => {
                                if (ct !== 'esds') return true;
                                const asc = esdsConfig(b.subarray(cb + 4, ce));
                                if (asc) Object.assign(a, aacConfig(asc));
                                else a.codec = 'mp3';      // MPEG-1 audio in mp4a (objectType 0x6B)
                                return false;
                            });
                        }
                        out.audio.push(a);
                    } else if (['tx3g', 'wvtt', 'stpp', 'c608'].includes(fmt)) out.text++;
                    return false;   // one sample description per track is enough
                });
                return true;
            });
            return (out.video || out.audio.length) ? out : { container: 'mp4', unknown: true };
        }
        // The AudioSpecificConfig inside an esds (descriptor 0x05), or null
        // when the track isn't AAC (objectTypeIndication other than 0x40/0x66-0x68).
        function esdsConfig(e) {
            let i = 0;
            const len = () => { let n = 0; for (let k = 0; k < 4 && i < e.length; k++) { const c = e[i++]; n = (n << 7) | (c & 0x7f); if (!(c & 0x80)) break; } return n; };
            let oti = null;
            while (i < e.length) {
                const tag = e[i++]; const n = len();
                if (tag === 0x03) { i += 2; const flags = e[i++]; if (flags & 0x80) i += 2; if (flags & 0x40) i += 1 + e[i]; if (flags & 0x20) i += 2; continue; }
                if (tag === 0x04) { oti = e[i]; i += 13; continue; }
                if (tag === 0x05) return (oti === null || [0x40, 0x66, 0x67, 0x68].includes(oti)) ? e.subarray(i, i + n) : null;
                i += n;
            }
            return null;
        }

        // ── AVI ──
        function parseAvi(b) {
            const out = { container: 'avi', video: null, audio: [], text: 0 };
            const s = ascii(b, 0, Math.min(b.length, 65536));
            let at = s.indexOf('strh');
            while (at >= 0 && at + 16 < b.length) {
                const kind = ascii(b, at + 8, 4);
                const strf = s.indexOf('strf', at + 8);
                if (kind === 'vids' && !out.video) {
                    const v = { codec: fourccCodec(ascii(b, at + 12, 4)), w: 0, h: 0 };
                    if (strf > 0) { v.w = b[strf + 12] | (b[strf + 13] << 8); v.h = Math.abs((b[strf + 16] | (b[strf + 17] << 8))); const c2 = fourccCodec(ascii(b, strf + 24, 4)); if (c2 !== 'other') v.codec = c2; }
                    out.video = v;
                } else if (kind === 'auds' && strf > 0) {
                    const tag = b[strf + 8] | (b[strf + 9] << 8);
                    const codec = { 0x55: 'mp3', 0x50: 'mp2', 0x2000: 'ac3', 0x2001: 'dts', 0xFF: 'aac', 0x1610: 'aac', 0x1: 'pcm', 0x161: 'wma', 0x162: 'wma' }[tag] || 'other';
                    out.audio.push({ codec, channels: b[strf + 10] | (b[strf + 11] << 8), isDefault: true });
                }
                at = s.indexOf('strh', at + 4);
            }
            return (out.video || out.audio.length) ? out : { container: 'avi', unknown: true };
        }

        // ── MPEG-TS ──
        function parseTs(b) {
            let pmt = null;
            const out = { container: 'ts', video: null, audio: [], text: 0 };
            for (let i = 0; i + 188 <= b.length; i += 188) {
                if (b[i] !== 0x47) break;
                const pid = ((b[i + 1] & 31) << 8) | b[i + 2];
                if (!(b[i + 1] & 0x40)) continue;
                let p = i + 4 + ((b[i + 3] & 0x20) ? 1 + b[i + 4] : 0);
                p += 1 + b[p];
                if (pid === 0 && pmt === null) { pmt = ((b[p + 10] & 31) << 8) | b[p + 11]; continue; }
                if (pid !== pmt || pmt === null) continue;
                const sectionLen = ((b[p + 1] & 15) << 8) | b[p + 2];
                const infoLen = ((b[p + 10] & 15) << 8) | b[p + 11];
                let q = p + 12 + infoLen;
                const end = Math.min(p + 3 + sectionLen - 4, i + 188);
                while (q + 5 <= end) {
                    const st = b[q];
                    const esLen = ((b[q + 3] & 15) << 8) | b[q + 4];
                    const v = { 0x1B: 'h264', 0x24: 'hevc', 0x02: 'mpeg2', 0x01: 'mpeg2', 0x10: 'mpeg4' }[st];
                    const a = { 0x0F: 'aac', 0x11: 'aac', 0x81: 'ac3', 0x87: 'eac3', 0x03: 'mp2', 0x04: 'mp2' }[st];
                    if (v && !out.video) out.video = { codec: v, w: 0, h: 0 };
                    if (a) out.audio.push({ codec: a, channels: 0, isDefault: true });
                    q += 5 + esLen;
                }
                break;
            }
            return (out.video || out.audio.length) ? out : { container: 'ts', unknown: true };
        }

        function parseMediaHead(b) {
            if (!b || b.length < 16) return null;
            try {
                if (b[0] === 0x1a && b[1] === 0x45 && b[2] === 0xdf && b[3] === 0xa3) return parseMatroska(b);
                if (isMp4Start(b)) return parseMp4(b);
                if (ascii(b, 0, 4) === 'RIFF' && ascii(b, 8, 3) === 'AVI') return parseAvi(b);
                if (b[0] === 0x47 && b.length > 188 && b[188] === 0x47) return parseTs(b);
            } catch (e) {
                dbg('head', `parse: ${e.message || e}`, 'warn');
            }
            return { unknown: true };
        }

        // ━━━━━━ What this device can't play ━━━━━━
        //
        // Measured on a 2nd-gen Chromecast (16-nov): MKV and MP4 with H.264 up
        // to level 4.1 and AAC stereo, MP3, AC-3, E-AC-3 and Opus 5.1 play;
        // HEVC and Xvid play the sound over black; AAC 5.1 (LC or HE) fails
        // right after the metadata (PIPELINE_ERROR_INITIALIZATION_FAILED).
        const nativePlays = (mime) => {
            try { return video.canPlayType(mime) !== ''; } catch (_) { return false; }
        };
        const channelsName = (n) => (n === 6 ? '5.1' : n === 8 ? '7.1' : n === 7 ? '6.1' : n > 0 ? `${n}ch` : '');
        function videoName(v) {
            const tenBit = (v.bits || 8) > 8 ? ', 10-bit' : '';
            const uhd = (v.h > 1088 || v.w > 1920) ? ', 4K' : '';
            switch (v.codec) {
                case 'hevc': return `HEVC (H.265)${tenBit}${uhd}`;
                case 'h264':
                    if ((v.bits || 8) > 8) return `H.264 10-bit${uhd}`;
                    if (v.level >= 4.2 && !uhd) return t('formatAvcHighLevel').replace('{level}', v.level.toFixed(1));
                    return `H.264${v.level ? ` (level ${v.level.toFixed(1)})` : ''}${uhd}`;
                case 'mpeg4': return 'MPEG-4 Part 2 (Xvid/DivX)';
                case 'mpeg2': return 'MPEG-2';
                case 'vc1': return 'VC-1 (WMV)';
                case 'av1': return `AV1${tenBit}${uhd}`;
                case 'vp9': return `VP9${uhd}`;
                default: return v.id || v.codec || '?';
            }
        }
        function audioName(a) {
            const names = {
                aac: a.he ? 'HE-AAC' : 'AAC', ac3: 'Dolby Digital (AC-3)', eac3: 'Dolby Digital Plus (E-AC-3)',
                dts: 'DTS', truehd: 'Dolby TrueHD', mp2: 'MPEG audio layer II', wma: 'WMA', mp3: 'MP3',
                opus: 'Opus', flac: 'FLAC', vorbis: 'Vorbis', pcm: 'PCM',
            };
            const ch = channelsName(a.channels);
            return `${names[a.codec] || a.id || a.codec}${ch ? ` ${ch}` : ''}`;
        }
        // The sound the TV's player picks: the default track, else the first.
        const mainAudio = (m) => (m.audio || []).find((a) => a.isDefault) || (m.audio || [])[0] || null;
        // One line for the debug panel; never a URL.
        function describeMedia(m) {
            const a = mainAudio(m);
            return [m.container, m.video ? videoName(m.video) : 'no video', a ? audioName(a) : 'no sound',
                (m.audio || []).length > 1 ? `${m.audio.length} sounds` : ''].filter(Boolean).join(' · ');
        }

        // What in [m] this device can't play — { part, name, codec } — or
        // null. [soundPlayed]: the sound was heard, so it isn't the culprit.
        function formatProblem(m, { soundPlayed } = {}) {
            const caps = probeCaps();
            const v = m.video;
            if (v) {
                const maxLevel = parseFloat(caps.h264MaxLevel || '0');
                let bad = false;
                if (v.codec === 'hevc') bad = !caps.hevc && !nativePlays('video/mp4; codecs="hvc1.1.6.L93.B0"');
                else if (v.codec === 'h264') {
                    bad = (v.bits || 8) > 8 ||
                        (maxLevel > 0 && v.level > maxLevel + 0.01) ||
                        ((v.h > 1088 || v.w > 1920) && caps.uhd === false);
                } else if (['mpeg4', 'mpeg2', 'vc1'].includes(v.codec)) bad = true;
                else if (v.codec === 'av1') bad = !nativePlays('video/mp4; codecs="av01.0.05M.08"');
                else if (v.codec === 'vp9') bad = !nativePlays('video/webm; codecs="vp9"');
                if (bad) return { part: 'video', name: videoName(v), codec: v.codec };
            }
            if (soundPlayed) return null;
            const a = mainAudio(m);
            if (a) {
                let bad = false;
                if (a.codec === 'aac') bad = a.channels > 2 && caps.aacMulti !== true;
                else if (a.codec === 'ac3') bad = !caps.ac3;
                else if (a.codec === 'eac3') bad = !caps.eac3;
                else if (['dts', 'truehd', 'wma', 'mp2'].includes(a.codec)) bad = true;
                if (bad) return { part: 'audio', name: audioName(a), codec: a.codec };
            }
            return null;
        }

        // ━━━━━━ Episode queue ━━━━━━
        //
        // The app sends the episodes that follow the one it loaded
        // ({type:'queue', forLoadId, items, autoAdvance}); the TV plays them
        // itself, so the chain no longer stops when the phone sleeps (iOS
        // suspends the app while it casts). As on the phone: around the
        // credits (the last 3%, between 30 s and 2 min, times the series'
        // learned `creditsScale` — the app's CreditsTiming) a card counts
        // down 8 s and the next episode starts, skipping the rest of the
        // credits; at the very end it starts at once. Pausing or seeking back
        // stops the count. The app can say {cmd:'next'}, {cmd:'cancel'} (that
        // episode then plays to its end, and the chain stops), or
        // {cmd:'scale', creditsScale} (the card came too early: later from
        // the next episode on).
        // Each queued LOAD carries the app's own load id, so the app knows
        // which episode the TV is on; what the TV finished is kept for an app
        // that comes back later ({type:'queue', current, left, history}).
        const QUEUE_MAX = 50;
        const HISTORY_MAX = 30;
        const CREDITS_SHARE = 0.03;
        const CREDITS_MIN_S = 30;
        const CREDITS_MAX_S = 120;
        const CREDITS_FLOOR_S = 12;
        const clampScale = (v) => Math.min(1, Math.max(0.3, Number(v) || 1));
        // Seconds before the end where the card shows (CreditsTiming.window).
        function creditsWindow(dur, scale) {
            const base = Math.min(CREDITS_MAX_S, Math.max(CREDITS_MIN_S, Math.round(dur * CREDITS_SHARE)));
            return Math.max(CREDITS_FLOOR_S, Math.round(base * clampScale(scale)));
        }
        let carriedQueue = null;      // the rest of the queue, for the episode on its way
        const queueHistory = [];      // { loadId, pos, dur, finished }

        const upnextEl = document.getElementById('upnext');
        function showUpNext(item, left) {
            if (!upnextEl) return;
            const se = (item.season && item.episode) ? `S${item.season} · E${item.episode}` : (item.episode ? `E${item.episode}` : '');
            document.getElementById('upnext-label').textContent = t('upNextLabel');
            document.getElementById('upnext-title').textContent = [se, item.title].filter(Boolean).join(' — ');
            document.getElementById('upnext-count').textContent = t('upNextIn').replace('{seconds}', String(left));
            upnextEl.classList.remove('hidden');
        }
        function hideUpNext() {
            if (upnextEl) upnextEl.classList.add('hidden');
        }

        function queueState() {
            const s = session;
            return {
                type: 'queue', v: 1,
                current: s ? s.loadId : null,
                left: (s && s.queue) ? s.queue.items.map((i) => i.loadId) : [],
                history: queueHistory.slice(),
            };
        }

        function onQueueMessage(data) {
            const s = session;
            if (!s || !data.forLoadId || s.loadId !== data.forLoadId) {
                dbg('queue', 'for another load: ignored', 'warn');
                return;
            }
            if (data.cmd === 'next') {
                if (s.queue && s.queue.items.length) advanceQueue(s, 'app');
                return;
            }
            if (data.cmd === 'scale') {
                if (s.queue) s.queue.creditsScale = clampScale(data.creditsScale);
                return;
            }
            if (data.cmd === 'cancel') {
                if (s.queue) {
                    s.queue.cancelled = true;
                    s.queue.shownLeft = 0;
                    hideUpNext();
                    setState(s, s.state, s.lastExtra);
                }
                return;
            }
            if (!Array.isArray(data.items)) return;
            const items = data.items
                .filter((i) => i && typeof i.loadId === 'string' && typeof i.url === 'string' && /^https?:\/\//i.test(i.url))
                .slice(0, QUEUE_MAX);
            s.queue = {
                items,
                autoAdvance: data.autoAdvance !== false,
                countdownSec: Math.min(30, Math.max(3, Number(data.countdownSec) || 8)),
                creditsScale: clampScale(data.creditsScale),
                cancelled: false,
                anchor: -1,
                shownLeft: 0,
            };
            dbg('queue', `${items.length} episode(s) next`, 'ok');
            setState(s, s.state, s.lastExtra);
        }

        video.addEventListener('timeupdate', () => {
            const s = session;
            if (s && s.queue && !s.isLive) checkUpNext(s);
        });

        function checkUpNext(s) {
            const q = s.queue;
            if (s.failed || q.cancelled || !q.autoAdvance || !q.items.length) return;
            const dur = video.duration;
            if (!isFinite(dur) || dur < 60) return;
            const pos = video.currentTime;
            if (dur - pos > creditsWindow(dur, q.creditsScale)) {
                if (q.anchor >= 0) {
                    q.anchor = -1;
                    q.shownLeft = 0;
                    hideUpNext();
                    setState(s, s.state, s.lastExtra);
                }
                return;
            }
            if (q.anchor < 0) q.anchor = pos;
            const left = Math.ceil(q.countdownSec - (pos - q.anchor));
            if (left <= 0) {
                advanceQueue(s, 'credits');
                return;
            }
            if (left !== q.shownLeft) {
                q.shownLeft = left;
                showUpNext(q.items[0], left);
                setState(s, s.state, s.lastExtra);
            }
        }

        function advanceQueue(s, why) {
            const q = s.queue;
            if (session !== s || !q || !q.items.length) return;
            const item = q.items[0];
            queueHistory.push({
                loadId: s.loadId,
                pos: Math.floor(video.currentTime || 0),
                dur: isFinite(video.duration) ? Math.floor(video.duration) : null,
                finished: true,
            });
            while (queueHistory.length > HISTORY_MAX) queueHistory.shift();
            carriedQueue = {
                forLoadId: item.loadId,
                items: q.items.slice(1),
                autoAdvance: q.autoAdvance,
                countdownSec: q.countdownSec,
                creditsScale: q.creditsScale,
            };
            q.items = [];
            hideUpNext();
            dbg('queue', `→ the next episode (${why}), ${carriedQueue.items.length} after it`, 'ok');
            const req = queuedRequest(s, item);
            pendingQueued = item.loadId;
            const done = () => afterQueuedLoad(req, item);
            try {
                const p = playerManager.load(req);
                if (p && p.then) p.then(done, done); else done();
            } catch (e) {
                dbg('queue', `load threw: ${(e && e.message) || e}`, 'err');
                done();
            }
        }

        function afterQueuedLoad(req, item) {
            if (pendingQueued === item.loadId) {
                // CAF loaded it without passing it through the interceptor.
                pendingQueued = null;
                dbg('queue', 'CAF loaded the episode itself: following it', 'warn');
                handleLoad(req, true);
            }
            sendToApps(queueState());
        }

        // The next episode's LOAD, as the app would have sent it: its own
        // load id, the same handshake, and the episode's details for the
        // lock screen and Google Home.
        function queuedRequest(s, item) {
            const M = cast.framework.messages;
            const req = new M.LoadRequestData();
            const media = new M.MediaInformation();
            media.contentId = item.url;
            media.contentUrl = item.url;
            media.contentType = item.contentType || 'video/mp4';
            media.streamType = M.StreamType.BUFFERED;
            if (item.duration > 0) media.duration = item.duration;
            const md = new M.TvShowMediaMetadata();
            md.title = item.title || '';
            if (item.seriesTitle) md.seriesTitle = item.seriesTitle;
            if (item.season) md.season = item.season;
            if (item.episode) md.episode = item.episode;
            if (item.imageUrl) md.images = [new M.Image(item.imageUrl)];
            media.metadata = md;
            req.media = media;
            req.autoplay = true;
            req.currentTime = item.start > 0 ? item.start : 0;
            const base = s.custom || {};
            req.customData = Object.assign({}, base, {
                nipa: Object.assign({}, base.nipa || {}, { loadId: item.loadId }),
            });
            return req;
        }

        // ━━━━━━ HLS engine (hls.js via MSE) ━━━━━━
        //
        // hls.js owns the <video> element through MSE; CAF doesn't
        // re-assign video.src on top of us, so we can safely wait for
        // the first `playing` event before resolving — the sender then
        // shows "casting" only when there's a real frame on screen.
        function loadWithHlsJs(request, opts) {
            return new Promise((resolve) => {
                const s = newSession(opts);
                s.engine = 'hls';
                s.request = request;
                s.settle = resolve;
                if (opts.liveTs) {
                    s.hlsUrl = tsToM3u8(opts.url);
                    // CAF loads a non-HLS request into the <video> itself and
                    // would fight hls.js for it; present the request as the
                    // HLS one actually playing. fallBackToTs() restores it.
                    const media = request.media;
                    s.tsMedia = {
                        contentUrl: media.contentUrl,
                        contentId: media.contentId,
                        contentType: media.contentType,
                    };
                    if (media.contentUrl) media.contentUrl = s.hlsUrl;
                    if (media.contentId) media.contentId = s.hlsUrl;
                    media.contentType = 'application/x-mpegurl';
                    s.via = 'ts-sibling';
                    dbg('engine', 'live .ts → hls.js with its .m3u8', 'ok');
                } else {
                    s.via = 'm3u8';
                    dbg('engine', 'hls.js', 'ok');
                }
                setState(s, 'starting');
                // Safety net: CAF must not wait forever for the first frame.
                // Resolving keeps the session — and a provider wait — going;
                // the screen says what is happening.
                later(s, 20000, () => {
                    if (!s.settle) return;
                    dbg('LOAD', 'no PLAYING in 20s — resolving optimistically', 'warn');
                    settleOk(s);
                });
                startHls(s);
                // Apps on the status channel follow the channel there: the
                // LOAD only has to create the media session.
                if (feature('nipaStatus')) settleOk(s);
            });
        }

        function startHls(s) {
            if (session !== s) return;
            if (hls) { hls.destroy(); hls = null; }
            s.attemptStartedAt = Date.now();
            s.attemptPlayed = false;
            s.emptyFrags = 0;
            s.lastProgressAt = Date.now();
            const url = s.hlsUrl || s.url;
            // Live: hls.js starts at the live edge. VOD rebuilt after it
            // played: pick up where it was.
            const startTime = s.isLive ? 0 : (s.hasPlayed ? Math.floor(lastKnownTime) : s.startTime);

            const hlsConfig = {
                debug: false, enableWorker: true,
                lowLatencyMode: false,
                // Cast devices give MSE far less memory than desktop Chrome
                // (~30 MB of video on a 2nd-gen Chromecast). hls.js's defaults
                // (60 MB, unbounded back buffer) overflowed it: QuotaExceeded,
                // buffer collapse, stalls and re-downloaded fragments.
                backBufferLength: 10,
                maxBufferLength: 20, maxMaxBufferLength: 30,
                maxBufferSize: 20 * 1000 * 1000,
                // The Cast pipeline takes longer than desktop to restart after
                // a seek; the defaults (2 s, 3 nudges) gave up too early.
                highBufferWatchdogPeriod: 5, nudgeMaxRetry: 6,
                startLevel: -1, fragLoadingMaxRetry: 5,
                manifestLoadingMaxRetry: 3, levelLoadingMaxRetry: 3,
                fragLoadingRetryDelay: 1000, manifestLoadingTimeOut: 10000,
            };
            // resumeV2: let hls.js begin loading AT the resume point instead
            // of loading from 0 and seeking once the manifest is parsed.
            if (feature('resumeV2') && startTime > 0) hlsConfig.startPosition = startTime;
            const h = hls = new Hls(hlsConfig);

            h.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
                if (session !== s || hls !== h) return;
                const levels = (data && data.levels) || [];
                const summary = levels.map((l) => {
                    const codecs = [l.videoCodec, l.audioCodec].filter(Boolean).join('+');
                    const res = (l.width && l.height) ? `${l.width}x${l.height}` : '?';
                    const br = l.bitrate ? `${Math.round(l.bitrate / 1000)}k` : '?';
                    return `${res}@${br}[${codecs || '?'}]`;
                }).slice(0, 4).join(' ');
                dbg('manifest', `${levels.length} level(s): ${summary || '(none)'}`, 'ok');
                if (s.slotWaitStartedAt) {
                    const waited = Math.round((Date.now() - s.slotWaitStartedAt) / 1000);
                    dbg('slot', `provider accepted after ${waited}s`, 'ok');
                    s.slotWaitStartedAt = 0;
                    s.slotRetries = 0;
                }
                const lv = levels.find((l) => l && l.videoCodec);
                if (lv) s.videoCodec = lv.videoCodec;
                showLoading(t('buffering'));
                setState(s, 'buffering');
                // Legacy path only — under resumeV2 hls.js starts at
                // `startPosition` and the guard verifies it.
                if (startTime > 0 && !feature('resumeV2')) video.currentTime = startTime;
                video.play().catch((e) => dbg('hls', `play() rejected: ${e.message || e}`, 'warn'));
            });

            h.on(Hls.Events.LEVEL_SWITCHED, (e, data) => {
                dbg('hls', `level → ${data.level}`);
            });

            // hls.js reads only H.264 video out of MPEG-TS: an MPEG-2 or HEVC
            // channel yields no video track, no error, and sound over black.
            // Say so (radio channels have no video either, hence a notice and
            // not an error).
            h.on(Hls.Events.BUFFER_CODECS, (e, tracks) => {
                if (session !== s || hls !== h) return;
                const vt = tracks && (tracks.video || tracks.audiovideo);
                // Playlists often don't declare codecs; the demuxer knows.
                if (vt && vt.codec && !s.videoCodec) s.videoCodec = vt.codec;
                const hasVideo = !!vt;
                if (!hasVideo && tracks && tracks.audio) {
                    dbg('codec', 'no video track this device can read — sound only', 'warn');
                    showNotice(t('audioOnly'));
                    s.audioOnly = true;
                    setState(s, s.state, s.lastExtra);
                }
            });

            // Fragments arrive and hls.js reports them buffered, yet nothing
            // playable is in the media buffer: hls.js dropped every frame.
            // Seen with field-coded interlaced H.264 (1080i broadcast relays):
            // each field becomes its own sample and no sample is a keyframe.
            // Rebuilding can't help; say so after two fragments instead of
            // "Buffering..." until the watchdog gives up minutes later.
            h.on(Hls.Events.FRAG_BUFFERED, (e, data) => {
                if (session !== s || hls !== h || s.attemptPlayed) return;
                if (!data || !data.frag || data.frag.type !== 'main') return;
                // The video SourceBuffer itself when there is one: the
                // element's ranges are the intersection with audio, which can
                // lag behind on streams with a separate audio playlist.
                const sbs = (h.bufferController && h.bufferController.sourceBuffer) || {};
                const vsb = sbs.video || sbs.audiovideo;
                let ranges = video.buffered;
                try { if (vsb) ranges = vsb.buffered; } catch (_) { /* removed */ }
                if (ranges.length > 0) { s.emptyFrags = 0; return; }
                s.emptyFrags += 1;
                dbg('hls', `fragment ${data.frag.sn} buffered, media buffer still empty (${s.emptyFrags})`, 'warn');
                if (s.emptyFrags >= 2) {
                    failSession(s, { kind: 'undecodable', codeLine: `NOTHING DECODABLE · ${s.emptyFrags} FRAGMENTS` });
                }
            });

            h.on(Hls.Events.ERROR, (e, data) => onHlsError(s, h, data));

            h.loadSource(url);
            h.attachMedia(video);
        }

        function onHlsError(s, h, data) {
            if (session !== s || hls !== h || s.failed) return;
            const D = Hls.ErrorDetails;
            const status = data && data.response && data.response.code;
            const summary = `${data.type || '?'} · ${data.details || '?'}` +
                (status ? ` · HTTP ${status}` : '') +
                (data.fatal ? ' · FATAL' : '');

            // A SourceBuffer refused the codec. Not fatal to hls.js, which
            // carries on with the tracks it could create; without video
            // that's sound over a black screen, so fail on a video track.
            if (data.details === D.BUFFER_ADD_CODEC_ERROR) {
                s.codecMime = data.mimeType || s.codecMime;
                dbg('codec', `refused ${data.mimeType || '?'}`, 'err');
                if (/^video\//i.test(data.mimeType || '')) failSession(s, codecFailure(s));
                return;
            }
            if (data.details === D.BUFFER_INCOMPATIBLE_CODECS_ERROR ||
                data.details === D.MANIFEST_INCOMPATIBLE_CODECS_ERROR) {
                failSession(s, codecFailure(s));
                return;
            }

            if (!data.fatal) {
                // hls.js handles stalls itself (nudges, gap jumps). Calling
                // startLoad() here aborted the fragment in flight and caused
                // re-downloads.
                dbg('hls', summary, 'warn');
                return;
            }

            // The provider refuses the connection: wait for it to free up.
            if (CONN_REFUSED_STATUSES.includes(status)) {
                waitForSlot(s, status, summary);
                return;
            }

            const playlistDetails = [
                D.MANIFEST_LOAD_ERROR, D.MANIFEST_LOAD_TIMEOUT, D.MANIFEST_PARSING_ERROR,
                D.LEVEL_EMPTY_ERROR, D.LEVEL_LOAD_ERROR, D.LEVEL_LOAD_TIMEOUT,
                D.LEVEL_PARSING_ERROR,
            ];
            const noLevels = !h.levels || !h.levels.length;

            if (data.type === Hls.ErrorTypes.NETWORK_ERROR &&
                (playlistDetails.includes(data.details) || noLevels)) {
                // Live .ts LOAD whose provider has no HLS for the channel.
                if (s.hlsUrl && !s.hasPlayed &&
                    ([400, 403, 404, 405, 406].includes(status) ||
                     data.details === D.MANIFEST_PARSING_ERROR)) {
                    fallBackToTs(s, summary);
                    return;
                }
                const kind = httpKind(status);
                if (kind) {
                    failSession(s, { kind, codeLine: errorLine(data, status), status });
                    return;
                }
                // No status (network, CORS) or a timeout: often transient.
                if (rebuild(s, summary)) return;
                failSession(s, { codeLine: errorLine(data, status), reason: 'network' });
                return;
            }

            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                // Fragment level, playlist loaded: startLoad() resumes.
                if (!s.networkRecovered) {
                    s.networkRecovered = true;
                    dbg('recover', `${summary} → startLoad()`, 'warn');
                    h.startLoad();
                    return;
                }
                if (rebuild(s, summary)) return;
                failSession(s, { kind: httpKind(status), codeLine: errorLine(data, status), status });
                return;
            }

            // Media errors: recoverMediaError() left the element paused with
            // loading stopped (a silent freeze); rebuild from scratch instead.
            if (rebuild(s, summary)) return;
            failSession(s, { kind: 'stalled', codeLine: errorLine(data, status), reason: 'media' });
        }

        // The provider wait as the status channel reports it.
        function slotWait(s) {
            const since = Date.now() - s.slotWaitStartedAt;
            return {
                http: s.slotStatus,
                sinceMs: since,
                attempts: s.slotRetries,
                giveUpInMs: Math.max(0, SLOT_WAIT_MS - since),
            };
        }

        function waitForSlot(s, status, summary) {
            const now = Date.now();
            if (!s.slotWaitStartedAt) {
                s.slotWaitStartedAt = now;
                dbg('slot', `${summary} → waiting for the provider to free the connection`, 'warn');
            }
            dropHls();
            if (now - s.slotWaitStartedAt >= SLOT_WAIT_MS) {
                failSession(s, {
                    kind: status === 429 ? 'rateLimit' : 'connLimit',
                    codeLine: `PROVIDER REFUSED · HTTP ${status}`,
                    status,
                });
                return;
            }
            showLoading(t('waitingProviderTitle'), t('waitingProviderDetail'));
            s.slotStatus = status;
            setState(s, 'waitingSlot', { wait: slotWait(s) });
            const delay = SLOT_RETRY_DELAYS_MS[Math.min(s.slotRetries, SLOT_RETRY_DELAYS_MS.length - 1)];
            s.slotRetries += 1;
            later(s, delay, () => {
                const waited = Math.round((Date.now() - s.slotWaitStartedAt) / 1000);
                dbg('slot', `retry #${s.slotRetries} after ${waited}s`);
                startHls(s);
            });
        }

        function rebuild(s, reason) {
            const now = Date.now();
            // Before the first picture the cap is absolute, or a stream that
            // never starts would be rebuilt forever (another endless
            // "Loading..."); once it has played, it's per window.
            if (!s.hasPlayed && s.totalRebuilds >= MAX_REBUILDS) return false;
            s.rebuilds = s.rebuilds.filter((at) => now - at < REBUILD_WINDOW_MS);
            if (s.rebuilds.length >= MAX_REBUILDS) return false;
            s.rebuilds.push(now);
            s.totalRebuilds += 1;
            dbg('recover', `${reason} → rebuilding the stream (#${s.rebuilds.length})`, 'warn');
            if (s.hasPlayed) {
                // Resume from where it was, not the LOAD's start time.
                disarmStartTimeGuard();
                showLoading(t('reconnecting'));
                setState(s, 'reconnecting');
            }
            dropHls();
            s.networkRecovered = false;
            later(s, 1000, () => startHls(s));
            return true;
        }

        // The provider has no HLS for this live .ts: play the .ts itself, as
        // this receiver did before trying HLS first. Chromecast can't, so
        // that usually ends on the "only MPEG-TS" screen; devices that can
        // (some TVs) just play it.
        function fallBackToTs(s, summary) {
            dbg('engine', `${summary} → no HLS, trying the .ts natively`, 'warn');
            dropHls();
            s.hlsUrl = null;
            s.engine = 'native';
            s.via = 'ts-native';
            const onError = () => {
                video.removeEventListener('error', onError);
                if (session !== s) return;
                const code = video.error ? video.error.code : 0;
                failSession(s, { kind: 'tsOnly', codeLine: `MEDIA_ERROR · ${code} · MPEG-TS` });
            };
            video.addEventListener('error', onError);
            if (s.settle && s.tsMedia) {
                // CAF still waits on this LOAD: hand it back the original .ts
                // request and let CAF load it, as the native engine does.
                Object.assign(s.request.media, s.tsMedia);
                settleOk(s, s.request);
            } else {
                video.src = s.url;
                video.load();
                video.play().catch((e) => dbg('native', `play() rejected: ${e.message || e}`, 'warn'));
            }
        }

        // Progress bookkeeping for the watchdog, and the LOAD's success.
        video.addEventListener('playing', () => {
            const s = session;
            if (!s) return;
            s.hasPlayed = true;
            s.attemptPlayed = true;
            s.lastProgressAt = Date.now();
            settleOk(s);
            if (!s.failed && !(s.userPaused && video.paused)) setState(s, 'playing');
        });
        video.addEventListener('waiting', () => {
            const s = session;
            if (s && !s.failed && s.state === 'playing') setState(s, 'buffering');
        });
        video.addEventListener('ended', () => {
            const s = session;
            if (!s || s.failed) return;
            const q = s.queue;
            if (q && q.items.length && q.autoAdvance && !q.cancelled) {
                advanceQueue(s, 'ended');
                return;
            }
            setState(s, 'ended');
        });

        // ━━━━━━ Watchdog (hls engine) ━━━━━━
        //
        // hls.js recovers most hiccups itself, but the receiver used to freeze
        // silently: element paused after a media recovery, or no progress
        // while nothing errored. Every 5 s:
        //   * paused without the user asking → play()
        //   * no progress for FROZEN_AFTER_MS → rebuild (then give up)
        //   * an attempt that never started in NO_START_AFTER_MS → same
        // A provider wait, a user pause and a user seek are left alone.
        setInterval(() => {
            const s = session;
            // Heartbeat: the app knows the TV is alive and where it is.
            if (s) sendToApps(statusOf(s, s.state === 'waitingSlot' ? { wait: slotWait(s) } : s.lastExtra));
            if (!s || s.failed || s.engine !== 'hls' || s.slotWaitStartedAt || !hls) return;
            const now = Date.now();
            if (video.currentTime > s.lastProgressPos + 0.2 || video.currentTime < s.lastProgressPos - 1) {
                s.lastProgressPos = video.currentTime;
                s.lastProgressAt = now;
                return;
            }
            if (s.userPaused || isSeeking) {
                s.lastProgressAt = now;
                return;
            }
            // An attempt (the first or a rebuild) gets the start-up allowance;
            // "frozen" only applies once that attempt has shown a picture.
            if (!s.attemptPlayed) {
                if (now - s.attemptStartedAt > NO_START_AFTER_MS &&
                    !rebuild(s, `no picture after ${NO_START_AFTER_MS / 1000}s`)) {
                    failSession(s, { kind: 'stalled', codeLine: 'NO PLAYBACK', reason: 'noPlayback' });
                }
                return;
            }
            if (video.paused && video.readyState >= 3) {
                dbg('watchdog', 'paused without the user → play()', 'warn');
                video.play().catch(() => {});
            }
            if (now - s.lastProgressAt > FROZEN_AFTER_MS) {
                s.lastProgressAt = now;
                if (!rebuild(s, `frozen for ${FROZEN_AFTER_MS / 1000}s`)) {
                    failSession(s, { kind: 'stalled', codeLine: 'PLAYBACK FROZEN', reason: 'frozen' });
                }
            }
        }, 5000);

        // ━━━━━━ PLAY / PAUSE interceptors ━━━━━━
        //
        // CAF would normally route PLAY/PAUSE to its internal player, but we
        // told it to skip loading those (skipPlayersLoad), so we drive the
        // <video> element directly and then broadcastStatus(true) so the
        // sender sees the transition. SEEK doesn't need an interceptor —
        // CAF maps it to videoElement.currentTime out of the box once the
        // session has transitioned out of LOADING.
        const changePlaybackStatus = (shouldPlay) => (message) => {
            // The watchdog leaves a pause the user asked for alone.
            if (session) {
                session.userPaused = !shouldPlay;
                if (!session.failed) {
                    setState(session, shouldPlay ? (session.hasPlayed ? 'playing' : 'buffering') : 'paused');
                }
            }
            if (shouldPlay) {
                video.play().catch((e) => dbg('cmd', `play() rejected: ${e.message || e}`, 'warn'));
                dbg('cmd', 'PLAY');
            } else {
                video.pause();
                dbg('cmd', 'PAUSE');
            }
            playerManager.broadcastStatus(true);
            return message;
        };
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.PLAY,
            changePlaybackStatus(true)
        );
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.PAUSE,
            changePlaybackStatus(false)
        );
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.SEEK,
            (message) => {
                dbg('cmd', `SEEK → ${(message.currentTime || 0).toFixed(1)}s`);
                // The user (or the sender's corrective seek) chose a
                // position — stop re-applying the LOAD start time.
                disarmStartTimeGuard();
                // This is the only path that should label the overlay as
                // "Seeking…". Anything else (initial startTime, glitch
                // re-seeks) keeps the generic "Buffering…" copy.
                isSeeking = true;
                showLoading(t('seeking'));
                if (seekSlowTimer) clearTimeout(seekSlowTimer);
                if (seekStuckTimer) clearTimeout(seekStuckTimer);
                seekSlowTimer = setTimeout(() => {
                    if (isSeeking) showLoading(t('seekingSlow'));
                }, SEEK_SLOW_THRESHOLD_MS);
                seekStuckTimer = setTimeout(() => {
                    if (isSeeking) {
                        dbg('cmd', `SEEK stuck >${SEEK_STUCK_THRESHOLD_MS / 1000}s`, 'err');
                        showLoading(t('seekingStuck'));
                    }
                }, SEEK_STUCK_THRESHOLD_MS);
                return message;
            }
        );

        // ━━━━━━ Loading state ━━━━━━
        //
        // `isSeeking` is set ONLY by the SEEK message interceptor (i.e. the
        // user explicitly moved the position from the sender). The video
        // element's own `seeking` event also fires on internal seeks
        // (applying startTime on initial LOAD, jumping after a buffer
        // glitch, etc.) — those aren't real "user seeks" and shouldn't
        // change the overlay copy.
        //
        // For large unsegmented files (.mkv / .mp4 from IPTV providers)
        // a real seek can take 10-30 s while the receiver Range-fetches
        // the new position. Escalation:
        //   * 5 s  → "Seeking — this may take a moment"
        //   * 30 s → "Seek is taking too long…" (server probably won't
        //            respond; the user should try another position or
        //            stop the cast). The video element keeps trying in
        //            the background; we just stop pretending it's fine.
        let isSeeking = false;
        let seekSlowTimer = null;
        let seekStuckTimer = null;
        const SEEK_SLOW_THRESHOLD_MS = 5000;
        const SEEK_STUCK_THRESHOLD_MS = 30000;

        function clearSeekState() {
            isSeeking = false;
            if (seekSlowTimer) {
                clearTimeout(seekSlowTimer);
                seekSlowTimer = null;
            }
            if (seekStuckTimer) {
                clearTimeout(seekStuckTimer);
                seekStuckTimer = null;
            }
        }

        video.addEventListener('seeking', () => {
            dbg('video', `seeking → ${video.currentTime.toFixed(1)}s`);
            // Don't touch isSeeking here — only the explicit SEEK
            // interceptor below should drive the "Seeking…" overlay.
        });

        video.addEventListener('seeked', () => {
            dbg('video', 'seeked');
            // `seeked` only means the browser's seek operation completed.
            // Data may still be buffering, but isSeeking is owned by the
            // SEEK interceptor and the matching `playing` event.
            //
            // seekV2: a seek made while PAUSED never produces `playing`, so
            // the "Seeking…" overlay used to stay up (and escalate to "taking
            // too long") until the user pressed play. Settle it here instead.
            if (feature('seekV2') && video.paused && isSeeking) {
                dbg('video', 'seeked while paused → clearing seek overlay');
                clearSeekState();
                hideLoading();
            }
        });

        video.addEventListener('playing', () => {
            const w = video.videoWidth || 0;
            const h = video.videoHeight || 0;
            const dur = isFinite(video.duration) ? video.duration.toFixed(0) + 's' : 'live';
            dbg('video', `PLAYING ${w}x${h} dur=${dur}`, 'ok');
            clearSeekState();
            hideError();
            hideLoading();
            hideDebugSoon();
        });
        video.addEventListener('waiting', () => {
            dbg('video', 'waiting (buffering)', 'warn');
            showLoading(t(isSeeking ? 'seeking' : 'buffering'));
        });
        video.addEventListener('canplay', () => {
            dbg('video', 'canplay');
            setTimeout(() => { if (!video.paused) hideLoading(); }, 300);
        });
        video.addEventListener('stalled', () => dbg('video', 'stalled', 'warn'));
        video.addEventListener('loadedmetadata', () => {
            const w = video.videoWidth || 0;
            const h = video.videoHeight || 0;
            dbg('video', `metadata ${w}x${h}`);
        });

        // ━━━━━━ Retry ━━━━━━
        //
        // The on-TV Retry button replays the last LOAD locally. We don't
        // bounce it through CAF — that's already considered the load
        // "successful". The flow mirrors the LOAD interceptor's engine
        // router: HLS via hls.js, anything else via direct video.src.
        errorRetry.addEventListener('click', () => {
            if (!lastLoad) return;
            dbg('retry', 'user pressed Retry');
            hideError();
            cleanup();
            showLoading(t('retrying'));
            const { url, contentType, isLive } = lastLoad;
            // resumeV2: pick up where playback actually broke, not at the
            // original LOAD start time.
            const startTime = (feature('resumeV2') && lastKnownTime > lastLoad.startTime)
                ? Math.floor(lastKnownTime)
                : lastLoad.startTime;
            if (startTime !== lastLoad.startTime) dbg('retry', `resuming at ${startTime}s`);
            armStartTimeGuard(startTime);
            const isHls = url.includes('.m3u8') || (contentType || '').includes('mpegurl');
            const liveTs = !isHls && isLiveTs(url, isLive);
            // A fresh session: a provider wait starts over, and nothing is
            // pending in CAF (it considers the load done).
            const s = newSession({ url, contentType, startTime, isLive });
            setState(s, 'starting');
            if ((isHls || liveTs) && window.Hls && Hls.isSupported()) {
                s.engine = 'hls';
                s.via = liveTs ? 'ts-sibling' : 'm3u8';
                if (liveTs) s.hlsUrl = tsToM3u8(url);
                startHls(s);
            } else {
                s.via = 'native';
                s.request = lastRequest;
                startNativeAttempt(s);
                // For native, set the src directly — CAF isn't in the loop
                // for retries so there's no risk of a duplicate load here.
                video.src = url;
                video.load();
                if (startTime > 0) {
                    video.addEventListener('loadedmetadata', () => {
                        video.currentTime = startTime;
                    }, { once: true });
                }
                video.play().catch((e) => dbg('native', `play() rejected: ${e.message || e}`, 'warn'));
            }
        });

        // ━━━━━━ Start ━━━━━━
        const options = new cast.framework.CastReceiverOptions();
        // Don't fetch Shaka / MPL — we use hls.js for HLS and the native
        // <video> for everything else. Saves a download on startup and
        // prevents CAF from racing us for the media element.
        options.skipPlayersLoad = true;
        options.disableIdleTimeout = true;
        // Advertise the full set of basic transport commands so the sender
        // shows play/pause/seek buttons. Without this CAF reports an empty
        // supportedCommands mask and the sender greys out the controls.
        options.supportedCommands = cast.framework.messages.Command.ALL_BASIC_MEDIA;
        options.mediaElement = video;
        // The status channel (see "NiPa status channel"). Namespaces must be
        // declared before start.
        options.customNamespaces = { [NIPA_NS]: cast.framework.system.MessageType.JSON };
        context.start(options);
        dbg('ready', 'receiver started', 'ok');
        // The "Ready to cast" words wait for the app to say its language.
        readyTextTimer = setTimeout(() => showReadyText(recalledLang ? 'kept' : 'device'), READY_TEXT_WAIT_MS);
        if (!DEBUG_ALWAYS_VISIBLE) hideDebugSoon();
    </script>
</body>
</html>
