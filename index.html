<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IPTV Cast Receiver</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden;
               font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
        video { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; background: #000; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000;
            transition: opacity 0.5s ease;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }

        #loading { z-index: 100; }
        #error { z-index: 200; }

        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loading-text {
            color: rgba(255,255,255,0.6);
            font-size: 16px; margin-top: 20px;
            letter-spacing: 1px;
        }

        /* ━━━━━━ Error overlay ━━━━━━ */
        #error-icon {
            width: 84px; height: 84px;
            border-radius: 50%;
            background: rgba(229, 78, 78, 0.15);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 24px;
        }
        #error-icon svg { width: 44px; height: 44px; fill: #e54e4e; }
        #error-title {
            color: #fff; font-size: 28px; font-weight: 600;
            margin-bottom: 12px; text-align: center;
            max-width: 720px; padding: 0 32px;
        }
        #error-subtitle {
            color: rgba(255,255,255,0.65); font-size: 16px;
            line-height: 1.5; text-align: center;
            max-width: 640px; padding: 0 32px; margin-bottom: 28px;
        }
        #error-retry {
            background: #fff; color: #000;
            border: none; border-radius: 24px;
            padding: 12px 28px; font-size: 15px; font-weight: 600;
            cursor: pointer; outline: none;
        }
        #error-retry:focus { box-shadow: 0 0 0 3px rgba(255,255,255,0.4); }
        #error-code {
            position: absolute; bottom: 32px;
            color: rgba(255,255,255,0.3); font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="loading" class="overlay">
        <div class="spinner"></div>
        <div id="loading-text">Loading...</div>
    </div>
    <div id="error" class="overlay hidden">
        <div id="error-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 6l7.53 13H4.47L12 8zm-1 4v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
        </div>
        <div id="error-title">Stream unavailable</div>
        <div id="error-subtitle">The provider's server isn't responding. This isn't an app issue — try another channel or check back later.</div>
        <button id="error-retry">Retry</button>
        <div id="error-code"></div>
    </div>
    <video id="media" autoplay></video>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script>
        'use strict';

        // Single-language for now; structure left in place for future translations.
        const LANG = 'en';
        const STRINGS = {
            en: {
                loading: 'Loading...',
                buffering: 'Buffering...',
                retrying: 'Retrying...',
                errorTitle: 'Stream unavailable',
                errorSubtitle: "The provider's server isn't responding. This isn't an app issue — try another channel or check back later.",
                retry: 'Retry',
            },
        };
        const t = (key) => (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key];

        const video = document.getElementById('media');
        const loadingEl = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const errorEl = document.getElementById('error');
        const errorTitle = document.getElementById('error-title');
        const errorSubtitle = document.getElementById('error-subtitle');
        const errorCode = document.getElementById('error-code');
        const errorRetry = document.getElementById('error-retry');

        let hls = null;

        // Last LOAD request — kept for Retry and recovery diagnostics.
        let lastLoad = null;

        function showLoading(text) {
            loadingText.textContent = text || t('loading');
            loadingEl.classList.remove('hidden');
        }
        function hideLoading() {
            loadingEl.classList.add('hidden');
        }

        function showError({ codeLine }) {
            errorTitle.textContent = t('errorTitle');
            errorSubtitle.textContent = t('errorSubtitle');
            errorRetry.textContent = t('retry');
            errorCode.textContent = codeLine || '';
            hideLoading();
            errorEl.classList.remove('hidden');
            // Try to focus Retry so a TV remote can press it without a tap.
            try { errorRetry.focus(); } catch (_) {}
        }
        function hideError() {
            errorEl.classList.add('hidden');
        }

        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        function cleanup() {
            if (hls) { hls.destroy(); hls = null; }
            video.removeAttribute('src');
            video.load();
        }

        // ━━━━━━ LOAD interceptor ━━━━━━
        //
        // We drive playback ourselves (hls.js or native <video>) and resolve
        // with `null` so CAF doesn't fight us with its default pipeline.
        // Resolving `null` also stops CAF from broadcasting request.media to
        // the sender, so we propagate metadata explicitly via setMediaInformation().
        // Without that call, the sender's mini controller only sees the URL.
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            (request) => {
                const url = request.media.contentUrl || request.media.contentId;
                const contentType = (request.media.contentType || '').toLowerCase();
                const startTime = request.currentTime || 0;

                cleanup();
                hideError();
                showLoading(t('loading'));

                if (!url) return request;

                // Push title / images / streamType to the sender.
                playerManager.setMediaInformation(request.media, /*opt_broadcast=*/true);

                lastLoad = { url, startTime, contentType };
                startPlayback(url, startTime, contentType);
                return new Promise((resolve) => resolve(null));
            }
        );

        function startPlayback(url, startTime, contentType) {
            const isHls = url.includes('.m3u8') || contentType.includes('mpegurl');
            if (isHls && Hls.isSupported()) {
                tryHlsJs(url, startTime, (errDetail) => {
                    // hls.js gave up — fall back to native <video>.
                    showLoading(t('retrying'));
                    attachNative(url, startTime, errDetail);
                });
            } else if (isHls && !Hls.isSupported() && video.canPlayType('application/vnd.apple.mpegurl')) {
                attachNative(url, startTime, null);
            } else {
                attachNative(url, startTime, null);
            }
        }

        function attachNative(url, startTime, prevDetail) {
            video.src = url;
            video.load();
            if (startTime > 0) {
                video.addEventListener('loadedmetadata', () => {
                    video.currentTime = startTime;
                }, { once: true });
            }
            // Catch native MediaElement errors — these are the only signal
            // we get when the native fallback also fails.
            const onNativeError = () => {
                video.removeEventListener('error', onNativeError);
                const code = video.error ? video.error.code : 0;
                const map = { 1: 'ABORTED', 2: 'NETWORK', 3: 'DECODE', 4: 'SRC_NOT_SUPPORTED' };
                const kind = map[code] || 'UNKNOWN';
                const detail = prevDetail ? `${prevDetail} → ${kind}` : `MEDIA_ERROR · ${kind}`;
                showError({ codeLine: detail });
            };
            video.addEventListener('error', onNativeError);
            video.play().catch(() => {});
        }

        function tryHlsJs(url, startTime, onFail) {
            let failed = false;
            // Each kind of recovery is attempted once; further failures escalate.
            const recovered = { media: false, network: false };

            hls = new Hls({
                debug: false, enableWorker: true,
                lowLatencyMode: false, backBufferLength: 30,
                maxBufferLength: 30, maxMaxBufferLength: 60,
                startLevel: -1, fragLoadingMaxRetry: 5,
                manifestLoadingMaxRetry: 3, levelLoadingMaxRetry: 3,
                fragLoadingRetryDelay: 1000, manifestLoadingTimeOut: 10000,
            });

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                showLoading(t('buffering'));
                if (startTime > 0) video.currentTime = startTime;
                video.play().catch(() => {});
            });

            hls.on(Hls.Events.ERROR, (e, data) => {
                if (!data.fatal) {
                    // Transient stall: ask hls.js to resume fetching once.
                    if (
                        data.type === Hls.ErrorTypes.NETWORK_ERROR &&
                        data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR &&
                        !recovered.network
                    ) {
                        recovered.network = true;
                        hls.startLoad();
                    }
                    return;
                }

                // One recovery attempt per category before giving up.
                if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !recovered.media) {
                    recovered.media = true;
                    hls.recoverMediaError();
                    return;
                }
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR && !recovered.network) {
                    recovered.network = true;
                    hls.startLoad();
                    return;
                }

                if (!failed) {
                    failed = true;
                    const httpStatus = data?.response?.code;
                    const detail = [
                        (data.type || 'ERROR').replace('Error', '').toUpperCase(),
                        data.details || 'unknown',
                        httpStatus ? `HTTP ${httpStatus}` : null,
                    ].filter(Boolean).join(' · ');
                    hls.destroy(); hls = null;
                    if (onFail) onFail(detail);
                }
            });

            hls.loadSource(url);
            hls.attachMedia(video);
        }

        // ━━━━━━ Loading state ━━━━━━
        video.addEventListener('playing', () => {
            hideError();
            hideLoading();
        });
        video.addEventListener('waiting', () => showLoading(t('buffering')));
        video.addEventListener('canplay', () => {
            setTimeout(() => { if (!video.paused) hideLoading(); }, 300);
        });

        // ━━━━━━ Retry ━━━━━━
        errorRetry.addEventListener('click', () => {
            if (!lastLoad) return;
            hideError();
            cleanup();
            showLoading(t('retrying'));
            startPlayback(lastLoad.url, lastLoad.startTime, lastLoad.contentType);
        });

        // ━━━━━━ Start ━━━━━━
        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        options.mediaElement = video;
        context.start(options);
    </script>
</body>
</html>
